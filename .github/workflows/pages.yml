name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    # A gram's report (data/nodes/**) is turned into the published data by
    # Aggregate founder nodes, whose completion deploys below; deploying the
    # raw report as well was a second deploy of the same minute, cancelled
    # four times out of five.
    paths-ignore: ['data/nodes/**']
  workflow_dispatch:
  # Data commits from aggregate-founders / catalog run under GITHUB_TOKEN, which
  # by design does NOT trigger `push` workflows — so Pages would never redeploy
  # with fresh network/bests/founders data. Redeploy when those finish, plus a
  # periodic fallback so the live site always catches up.
  workflow_run:
    workflows: ["Aggregate founder nodes", "Generate Release Catalog", "Build epnd"]
    types: [completed]
  schedule:
    - cron: '12 * * * *'

permissions:
  contents: read
  pages: write
  id-token: write

# THE ONLY PAGES DEPLOYER, ONE AT A TIME, NEVER INTERRUPTED. A deploy cancelled
# mid-flight leaves its Pages deployment pending, and every deploy after it is
# refused "Deployment failed, try again later" until GitHub times it out. So a
# running deploy finishes; a newer run waits, and only the newest waiting one
# runs -- it deploys everything committed by then.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    # Only what a finished run published: a cancelled or failed upstream run
    # published nothing, so there is nothing new to deploy.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Static Site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
