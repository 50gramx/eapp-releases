name: Deploy site to Firebase Hosting

# The brand site is a static export: every number on /, /regions and /region/<pincode>
# is fetched at BUILD time and baked into HTML. So a deploy is not only how code
# ships — it is the only way the network's state reaches a reader.
#
# This workflow runs from eapp-releases, which is the source of network truth:
#   - When aggregate-founders publishes new signed data (communities.json, models.json),
#     we rebuild the site to reflect those new regions and model measurements.
#   - When eapp-nextjs code changes, a manual trigger here rebuilds the site.
#   - Nightly schedule as backstop, in case a dispatch is lost.
#
# The site's own firebase-hosting-merge.yml is now manual-only (no auto triggers),
# to consolidate CI in the data source (eapp-releases) instead of the consumer.
#
# Sitemap generation: Automatic during build via src/app/sitemap.ts
#   - Fetches active regions from mesh API for dynamic /region/[pincode] URLs
#   - Fetches models from inference API for dynamic /inference/models/[slug] URLs
#   - Includes all static pages, excludes /demo/* dynamic routes
on:
  workflow_run:
    workflows: ['Aggregate founder nodes']
    types: [completed]
  workflow_dispatch:
  schedule:
    - cron: '17 1 * * *'

permissions:
  contents: read
  actions: read

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout eapp-nextjs repo
        uses: actions/checkout@v4
        with:
          repository: 50gramx/eapp-nextjs-implementation-firebase
          token: ${{ secrets.SITE_DISPATCH_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # ── THE VIEWER, DOWNLOADED FROM THE BUILD THAT PRODUCED IT ──────
      #
      # /world loads the same page a gram serves at /v1/world, plus the shell
      # that lets a browser dial a gram and verify what it gets back. It is Go
      # code compiled to wasm, and it is built by build-epnd.yml alongside the
      # daemon binaries — behind the same `go vet` gate, and only when
      # epn-daemon actually moves.
      #
      # This step used to check out epn-daemon and compile it here, which meant
      # a Go toolchain, a module download and an npm install on EVERY site
      # deploy — four times an hour, chasing aggregate-founders — to rebuild an
      # asset that had not changed. It also meant the site could not deploy at
      # all while epn-daemon was unreachable: a copy edit to a marketing page
      # was blocked by a token that has nothing to do with the site.
      #
      # Still copied, never forked: one definition, one build, downloaded here.
      - name: Fetch the world viewer (published by build-epnd)
        run: |
          set -euo pipefail
          base=https://github.com/50gramx/eapp-releases/releases/download/epnd-latest
          dest="$GITHUB_WORKSPACE/public/world/viewer"
          mkdir -p "$dest"
          tmp=$(mktemp -d)
          for f in epn.wasm wasm_exec.js epn-shell.js world-viewer.html checksums.txt; do
            curl -fsSL --retry 3 --retry-delay 5 -o "$tmp/$f" "$base/$f"
          done
          # VERIFY BEFORE SERVING. These arrive over the network now rather than
          # out of a compiler, so the published checksums are the only thing
          # standing between a truncated download and a broken viewer shipped
          # to every reader. grep the four lines we care about; checksums.txt
          # also covers the binaries, which are not here.
          ( cd "$tmp"
            grep -E ' (epn\.wasm|wasm_exec\.js|epn-shell\.js|world-viewer\.html)$' checksums.txt > viewer.sums
            if [ "$(wc -l < viewer.sums)" -ne 4 ]; then
              echo "::error::checksums.txt is missing viewer entries — has build-epnd published since this change?"
              exit 1
            fi
            sha256sum -c viewer.sums )
          # index.html, because that is what a static host serves at the root,
          # and public/ is what `output: export` copies verbatim into out/ — so
          # the viewer lands at /world/viewer/ with no route to declare.
          cp "$tmp/world-viewer.html" "$dest/index.html"
          cp "$tmp/epn.wasm" "$tmp/wasm_exec.js" "$tmp/epn-shell.js" "$dest/"
          rm -rf "$tmp"
          ls -la "$dest"

      - name: Install dependencies
        run: npm ci

      - name: Build static export (includes sitemap with real data)
        env:
          NEXT_PUBLIC_SITE_URL: https://50gramx.com
        run: npm run build

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CLOUD_50GRAMX }}
          channelId: live
          projectId: cloud-50gramx
          expires: 7d
