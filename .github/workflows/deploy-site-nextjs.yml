name: Deploy site to Firebase Hosting

# The brand site is a static export: every number on /, /regions and /region/<pincode>
# is fetched at BUILD time and baked into HTML. So a deploy is not only how code
# ships — it is the only way the network's state reaches a reader.
#
# This workflow runs from eapp-releases, which is the source of network truth:
#   - When aggregate-founders publishes new signed data (communities.json, models.json),
#     we rebuild the site to reflect those new regions and model measurements.
#   - When eapp-nextjs code changes, a manual trigger here rebuilds the site.
#   - Nightly schedule as backstop, in case a dispatch is lost.
#
# The site's own firebase-hosting-merge.yml is now manual-only (no auto triggers),
# to consolidate CI in the data source (eapp-releases) instead of the consumer.
#
# Sitemap generation: Automatic during build via src/app/sitemap.ts
#   - Fetches active regions from mesh API for dynamic /region/[pincode] URLs
#   - Fetches models from inference API for dynamic /inference/models/[slug] URLs
#   - Includes all static pages, excludes /demo/* dynamic routes
on:
  workflow_run:
    workflows: ['Aggregate founder nodes']
    types: [completed]
  workflow_dispatch:
  schedule:
    - cron: '17 1 * * *'

permissions:
  contents: read
  actions: read

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout eapp-nextjs repo
        uses: actions/checkout@v4
        with:
          repository: 50gramx/eapp-nextjs-implementation-firebase
          token: ${{ secrets.SITE_DISPATCH_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # ── THE VIEWER, BUILT FROM THE ONE PLACE IT IS DEFINED ────────────────
      #
      # /world loads the same page a gram serves at /v1/world, plus the shell
      # that lets a browser dial a gram and verify what it gets back. Built
      # here rather than committed, because epn.wasm is ~14 MB and a binary in
      # git that must match a Go package is a binary that will not.
      #
      # Copied, never forked: two copies of this viewer is how a broken one
      # shipped three times.
      - name: Checkout epn-daemon (for the world viewer)
        uses: actions/checkout@v4
        with:
          repository: 50gramx/epn-daemon
          # CI_READ_TOKEN, not SITE_DISPATCH_TOKEN. The dispatch token is scoped
          # to the site repo, so checking out epn-daemon with it fails as a bare
          # "Not Found" from the repos API -- which reads like the repo is gone
          # rather than like the token cannot see it. build-epnd.yml already
          # uses CI_READ_TOKEN for exactly this checkout.
          token: ${{ secrets.CI_READ_TOKEN }}
          path: .epn-daemon

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: .epn-daemon/go.mod
          cache-dependency-path: .epn-daemon/go.sum

      - name: Build the world viewer
        run: |
          set -euo pipefail
          cd .epn-daemon/web/shell
          npm install --no-audit --no-fund
          # Invoked through bash rather than as ./build.sh: the file mode of a
          # script committed from a Windows checkout is not something this
          # workflow should depend on.
          bash build.sh dist
          # public/ is what `output: export` copies verbatim into out/, so the
          # viewer lands at /world/viewer/ with no route to declare.
          dest="$GITHUB_WORKSPACE/public/world/viewer"
          mkdir -p "$dest"
          cp dist/index.html dist/epn-shell.js dist/epn.wasm dist/wasm_exec.js "$dest/"
          ls -la "$dest"

      - name: Install dependencies
        run: npm ci

      - name: Build static export (includes sitemap with real data)
        env:
          NEXT_PUBLIC_SITE_URL: https://50gramx.com
        run: npm run build

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CLOUD_50GRAMX }}
          channelId: live
          projectId: cloud-50gramx
          expires: 7d
