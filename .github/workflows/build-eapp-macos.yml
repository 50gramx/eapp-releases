name: Build and Release macOS App

# Mirror of private eapp-live/.github/workflows/macos_build_release.yml.
# Manual trigger stays exactly as it is in the private repo: brand_id +
# release_channel, no confirm gate.
# Cadence automation (nightly/weekly/bi-weekly/stable across already-released
# brands) is handled centrally by build-cadence.yml, which calls this
# workflow via workflow_dispatch for each brand/platform pair.
on:
  workflow_dispatch:
    inputs:
      brand_id:
        description: Brand id to build
        required: true
        type: string
      release_channel:
        description: Release channel
        required: true
        default: stable
        type: choice
        options: [nightly, weekly, bi-weekly, stable]
      also_channels:
        description: Other channels due now (comma list); each gets this build by promotion, not a rebuild
        required: false
        default: ''
        type: string

permissions:
  contents: write

# Two runs for the same brand and platform would build the same thing side by
# side; the second waits and then finds it built (or promotable).
concurrency:
  group: build-macos-${{ inputs.brand_id }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.compare.outputs.build }}
      fingerprint: ${{ steps.compare.outputs.fingerprint }}
      parts: ${{ steps.compare.outputs.parts }}
      promotions: ${{ steps.compare.outputs.promotions }}
      any_promotions: ${{ steps.compare.outputs.any_promotions }}
      eapp_sha: ${{ steps.eapp.outputs.sha }}
      contracts_sha: ${{ steps.contracts_head.outputs.sha }}
      epnd_state: ${{ steps.epnd.outputs.state }}
      marker_path: ${{ steps.marker.outputs.path }}
    steps:
      - name: Resolve marker path
        id: marker
        run: echo "path=data/last-built/${{ inputs.brand_id }}-macos-${{ inputs.release_channel }}.json" >> "$GITHUB_OUTPUT"

      - name: Get latest eapp-live main SHA
        id: eapp
        env:
          GH_TOKEN: ${{ secrets.CI_READ_TOKEN }}
        run: |
          sha=$(gh api repos/50gramx/eapp-live/commits/main --jq .sha)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Get latest interaction-contracts main SHA
        id: contracts_head
        env:
          GH_TOKEN: ${{ secrets.CI_READ_TOKEN }}
        run: |
          sha=$(gh api repos/50gramx/eapp-interaction-contracts/commits/main --jq .sha)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Get current epnd-latest state
        id: epnd
        run: |
          state=$(curl -fsSL https://github.com/50gramx/eapp-releases/releases/download/epnd-latest/checksums.txt | sha256sum | awk '{print $1}')
          echo "state=$state" >> "$GITHUB_OUTPUT"

      # WHAT THIS BUILD IS MADE OF, AND WHETHER IT EXISTS ALREADY
      # (.github/scripts/build-plan.mjs): eapp-live minus docs, tests and the
      # other platforms' folders; the brand's resolved contract; this recipe;
      # the bundled gram. Same fingerprint as this channel's last build:
      # skip. Same as another channel's: promote that release. Else build.
      - name: Checkout eapp-releases (plan + markers)
        uses: actions/checkout@v4
        with:
          path: .plan
          sparse-checkout: |
            .github
            data/last-built

      - name: Checkout eapp-live tree (no file contents but tool/ci)
        uses: actions/checkout@v4
        with:
          repository: 50gramx/eapp-live
          token: ${{ secrets.CI_READ_TOKEN }}
          ref: ${{ steps.eapp.outputs.sha }}
          path: .plan-eapp
          filter: blob:none
          sparse-checkout: tool/ci

      - name: Checkout contracts (plan)
        uses: actions/checkout@v4
        with:
          repository: 50gramx/eapp-interaction-contracts
          token: ${{ secrets.CI_READ_TOKEN }}
          ref: ${{ steps.contracts_head.outputs.sha }}
          path: .plan-contracts

      - name: Compare against marker
        id: compare
        env:
          LEGACY: ${{ steps.eapp.outputs.sha }} ${{ steps.contracts_head.outputs.sha }} ${{ steps.epnd.outputs.state }}
        run: |
          set -euo pipefail
          cd .plan
          node .github/scripts/build-plan.mjs \
            --brand "${{ inputs.brand_id }}" \
            --platform "macos" \
            --channel "${{ inputs.release_channel }}" \
            --also "${{ inputs.also_channels }}" \
            --eapp "$GITHUB_WORKSPACE/.plan-eapp" \
            --contracts "$GITHUB_WORKSPACE/.plan-contracts" \
            --workflow ".github/workflows/build-eapp-macos.yml" \
            --epnd-state "${{ steps.epnd.outputs.state }}" \
            --legacy "$LEGACY" 

  build_and_release:
    needs: check
    if: needs.check.outputs.should_build == 'true'
    runs-on: macos-latest
    env:
      RELEASE_REPO: 50gramx/eapp-releases
      PLATFORM_ID: macos
      BRAND_ID: ${{ inputs.brand_id }}
      RELEASE_CHANNEL: ${{ inputs.release_channel }}
      # SIGNED AND NOTARIZED WHEN THE CERTIFICATE IS HERE (see the step below).
      # The App Store Connect key is the same one the iOS build uses; the
      # Developer ID certificate is the account holder's, exported as .p12.
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      MACOS_DEVID_P12: ${{ secrets.MACOS_DEVID_P12 }}
      MACOS_DEVID_P12_PASSWORD: ${{ secrets.MACOS_DEVID_P12_PASSWORD }}

    steps:
      - name: Checkout eapp-live source (private, read-only token)
        uses: actions/checkout@v4
        with:
          repository: 50gramx/eapp-live
          token: ${{ secrets.CI_READ_TOKEN }}
          ref: ${{ needs.check.outputs.eapp_sha }}

      - name: Checkout Interaction Contracts
        uses: actions/checkout@v4
        with:
          repository: 50gramx/eapp-interaction-contracts
          token: ${{ secrets.CI_READ_TOKEN }}
          path: .ci/eapp-interaction-contracts

      - name: Resolve Contracts Commit
        id: contracts
        run: echo "sha=$(git -C .ci/eapp-interaction-contracts rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # The app starts from this snapshot instead of fetching every contract
      # at launch (eapp-live lib/services/contract_snapshot.dart).
      - name: Snapshot the contracts into the app
        run: node tool/ci/snapshot_contracts.mjs --contracts-root ".ci/eapp-interaction-contracts" --out assets/contracts_snapshot.json

      - name: Resolve Contract Delivery
        id: brand
        run: |
          node tool/ci/resolve_contract_delivery.mjs \
            --contracts-root ".ci/eapp-interaction-contracts" \
            --brand-id "$BRAND_ID" \
            --platform "$PLATFORM_ID" \
            --channel "$RELEASE_CHANNEL" \
            --github-env "$GITHUB_ENV" \
            --github-output "$GITHUB_OUTPUT" \
            --output "brand-delivery.json"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.3'
          channel: stable
          cache: true

      # SWIFT PACKAGE MANAGER OFF FOR THIS BUILD. With it on, every run spent
      # 2 min 18 s "Adding Swift Package Manager integration" (the migrated
      # project is never kept) and ~3 min resolving packages before compiling
      # (run 43292342069), while the plugins build through CocoaPods anyway.
      - name: Enable macOS Desktop
        run: |
          flutter config --enable-macos-desktop
          flutter config --no-enable-swift-package-manager

      - name: Configure git for private dependencies
        # THE TOKEN MUST SURVIVE A REDIRECT. On the macOS runners GitHub answers
        # the clone of bharatsphere-app with a redirect to ".../bharatsphere-app.git/",
        # git drops the credentials carried in the rewritten URL, and pub fails
        # "could not read Username ... Device not configured" (iOS 11-05 07:22,
        # 11-06 18:10; macOS 11-05 08:57, 11-06 08:55). A credential stored for
        # github.com is offered again after the redirect, so the token lives
        # there as well as in the rewrite.
        env:
          CI_READ_TOKEN: ${{ secrets.CI_READ_TOKEN }}
        run: |
          git config --global url."https://${CI_READ_TOKEN}@github.com/".insteadOf "https://github.com/"
          git config --global credential.https://github.com.helper store
          echo "https://x-access-token:${CI_READ_TOKEN}@github.com" > "$HOME/.git-credentials"
          chmod 600 "$HOME/.git-credentials"

      - name: Get Dependencies
        run: flutter pub get

      - name: Cache CocoaPods Pods
        uses: actions/cache@v4
        with:
          path: macos/Pods
          key: ${{ runner.os }}-pods-${{ hashFiles('pubspec.lock', 'macos/Podfile') }}
          restore-keys: ${{ runner.os }}-pods-

      - name: Clean CocoaPods Specs
        run: rm -rf ~/.cocoapods/repos

      - name: Update CocoaPods Specs and Install Pods
        run: |
          pod repo update
          cd macos
          pod install --repo-update

      # Brand the native bundle name (Finder / Dock / menu bar) BEFORE the build,
      # so the branded Info.plist is covered by the build's ad-hoc signature
      # (patching post-build would invalidate CODE_SIGN_IDENTITY="-"). Fully
      # guarded: with no brand product-name it leaves the default plist untouched,
      # i.e. identical to prior behaviour. Icons stay the shared default until
      # per-brand logo assets exist.
      - name: Brand macOS bundle name
        env:
          BRAND_PRODUCT_NAME: ${{ steps.brand.outputs.brand_product_name }}
          MACOS_BUNDLE_ID: ${{ steps.brand.outputs.macos_bundle_id }}
        run: |
          set -euo pipefail
          PLIST="macos/Runner/Info.plist"
          if [ -n "${BRAND_PRODUCT_NAME:-}" ]; then
            /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName $BRAND_PRODUCT_NAME" "$PLIST" 2>/dev/null \
              || /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string $BRAND_PRODUCT_NAME" "$PLIST"
            echo "Branded macOS bundle display name -> $BRAND_PRODUCT_NAME"
          else
            echo "No brand_product_name resolved — leaving default bundle name."
          fi
          # Bundle identifier comes from contracts (resolver derives it from the
          # brand launch-environment); never hardcoded. Overrides the default
          # $(PRODUCT_BUNDLE_IDENTIFIER) so each brand is a distinct macOS app.
          if [ -n "${MACOS_BUNDLE_ID:-}" ]; then
            /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier $MACOS_BUNDLE_ID" "$PLIST"
            echo "Branded macOS bundle identifier -> $MACOS_BUNDLE_ID"
          else
            echo "No macos_bundle_id resolved — leaving default identifier."
          fi

      - name: Build macOS App
        run: |
          flutter build macos --release \
            --dart-define=BUILD_ID=${{ github.run_number }} \
            --dart-define=BRAND_ID=${{ steps.brand.outputs.brand_id }} \
            --dart-define=ENVIRONMENT="${{ steps.brand.outputs.brand_environment }}" \
            --dart-define=BRAND_DISPLAY_NAME="${{ steps.brand.outputs.brand_display_name }}" \
            --dart-define=BRAND_PRODUCT_NAME="${{ steps.brand.outputs.brand_product_name }}" \
            --dart-define=BRAND_WINDOW_TITLE="${{ steps.brand.outputs.brand_window_title }}" \
            --dart-define=BRAND_LOGO="${{ steps.brand.outputs.brand_logo }}" \
            --dart-define=BRAND_SESSION_FILE="${{ steps.brand.outputs.brand_session_file }}" \
            --dart-define=BRAND_SINGLETON_NAME="${{ steps.brand.outputs.brand_singleton_name }}" \
            --dart-define=BRAND_ORGANISATION="${{ steps.brand.outputs.brand_organisation }}" \
            --dart-define=BRAND_COMMUNITY_CODE=${{ steps.brand.outputs.brand_community_code }} \
            --dart-define=BRAND_SHOW_APP_LIBRARY=${{ steps.brand.outputs.brand_show_app_library }} \
            --dart-define=BRAND_SHOW_PRIVATE_SPACE_TILE=${{ steps.brand.outputs.brand_show_private_space_tile }} \
            --dart-define=BRAND_SHOW_HISTORY=${{ steps.brand.outputs.brand_show_history }} \
            --dart-define=BRAND_SHOW_PANE_SWITCHER=${{ steps.brand.outputs.brand_show_pane_switcher }} \
            --dart-define=BRAND_SHOW_SPOTLIGHT=${{ steps.brand.outputs.brand_show_spotlight }} \
            --dart-define=BRAND_SHOW_OPEN_TABS_SUMMARY=${{ steps.brand.outputs.brand_show_open_tabs_summary }} \
            --dart-define=BRAND_SHOW_OPEN_COMMUNITIES_SUMMARY=${{ steps.brand.outputs.brand_show_open_communities_summary }} \
            --dart-define=BRAND_SHOW_USER_DETAILS=${{ steps.brand.outputs.brand_show_user_details }} \
            --dart-define=BRAND_SHOW_OPEN_PAGES_TABS=${{ steps.brand.outputs.brand_show_open_pages_tabs }} \
            --dart-define=BRAND_CLEAR_SESSION_ON_START=${{ steps.brand.outputs.brand_clear_session_on_start }} \
            --dart-define=BRAND_UNBOUNDED_SOLUTION_NAV=${{ steps.brand.outputs.brand_unbounded_solution_nav }} \
            --dart-define=BRAND_SHOW_WALLPAPER_CREDIT=${{ steps.brand.outputs.brand_show_wallpaper_credit }} \
            --dart-define=BRAND_SHOW_AUTO_APP_SELECTOR=${{ steps.brand.outputs.brand_show_auto_app_selector }} \
            --dart-define=BRAND_PREFERRED_WALLPAPER="${{ steps.brand.outputs.brand_preferred_wallpaper }}" \
            --dart-define=BRAND_NAVIGATION_JSON_B64=${{ steps.brand.outputs.brand_navigation_json_b64 }}

      - name: Bundle epnd daemon
        id: epnd
        if: env.SIDECAR_EPND == 'true'
        continue-on-error: true
        run: |
          set -euo pipefail
          APP=$(find build/macos/Build/Products/Release -maxdepth 1 -name "*.app" | head -1)
          if [ -z "$APP" ]; then echo "No .app found"; exit 1; fi
          BASE="https://github.com/$RELEASE_REPO/releases/download/epnd-latest"
          curl -fsSL "$BASE/checksums.txt" -o /tmp/epnd-checksums.txt
          for ASSET in epnd-darwin-amd64 epnd-darwin-arm64; do
            curl -fsSL "$BASE/$ASSET" -o "$APP/Contents/MacOS/$ASSET"
            chmod +x "$APP/Contents/MacOS/$ASSET"
            WANT=$(grep "$ASSET" /tmp/epnd-checksums.txt | awk '{print $1}')
            GOT=$(shasum -a 256 "$APP/Contents/MacOS/$ASSET" | awk '{print $1}')
            if [ -n "$WANT" ] && [ "$WANT" != "$GOT" ]; then
              echo "epnd checksum mismatch for $ASSET: want $WANT got $GOT"
              exit 1
            fi
            if [ "$ASSET" = "epnd-darwin-arm64" ]; then
              VERSION=$("$APP/Contents/MacOS/$ASSET" version 2>/dev/null | awk '{print $2}')
              echo "version=${VERSION:-unknown}" >> "$GITHUB_OUTPUT"
              echo "asset=$ASSET" >> "$GITHUB_OUTPUT"
              echo "sha256=$GOT" >> "$GITHUB_OUTPUT"
            fi
          done

      # DEVELOPER ID, NOT THE MAC APP STORE (2026-11-12). The Mac app runs the
      # full gram as a child process and installs its updater, so it is built
      # without the App Sandbox -- and the Mac App Store and TestFlight for Mac
      # accept only sandboxed apps. The standard route for such an app is
      # Developer ID signing plus Apple's notarization: it opens on any Mac
      # with no warning and keeps the full gram. Until the certificate secret
      # exists the build stays ad hoc, exactly as before.
      #
      # Signed here, AFTER the gram binaries are added: adding files to an
      # already-sealed app broke its seal, which is one reason a downloaded
      # build showed as damaged. Inside out: frameworks and libraries, the
      # bundled gram, then the app, all with the hardened runtime.
      # FIRST TRY: APPLE'S CLOUD-MANAGED DEVELOPER ID, with the App Store
      # Connect key the iOS build already has -- no certificate stored here. The
      # app is archived unsigned-ad-hoc (like iOS, so no development certificate
      # is minted per run), the gram binaries are put in, and the export signs
      # everything with the Developer ID certificate Apple keeps. Then notarized
      # and stapled. If Apple refuses (the key's role, or the account holder has
      # not allowed cloud-managed Developer ID), this step fails without failing
      # the build, its log says why, and the .p12 step below is the fallback.
      - name: Sign with Developer ID (Apple cloud-managed) and notarize
        id: cloudsign
        if: env.MACOS_DEVID_P12 == '' && env.ASC_KEY_ID != '' && env.ASC_ISSUER_ID != '' && env.ASC_KEY_P8 != ''
        continue-on-error: true
        env:
          TEAM_ID: ${{ steps.brand.outputs.ios_team_id }}
        run: |
          set -euo pipefail
          KEY="$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"
          printf '%s\n' "$ASC_KEY_P8" > "$KEY"
          AUTH=(-allowProvisioningUpdates -authenticationKeyPath "$KEY" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID")
          # THE APP ALREADY BUILT, NOT A SECOND COMPILE (13 Nov). This step used
          # to run `xcodebuild archive` -- 9 more minutes compiling the same app
          # -- and that archive failed every time: CODE_SIGNING_REQUIRED=NO made
          # the pods' embed phase leave tflite_flutter.framework unsigned, and
          # signing the app around it then refused ("code object is not signed
          # at all"). An .xcarchive is a folder: the app and an Info.plist. So
          # the app flutter built (signed consistently, gram binaries already
          # in) is wrapped in one, and the export re-signs all of it with the
          # Developer ID certificate Apple keeps.
          BUILT=$(find build/macos/Build/Products/Release -maxdepth 1 -name "*.app" | head -1)
          ARC="$RUNNER_TEMP/Runner.xcarchive"
          rm -rf "$ARC"; mkdir -p "$ARC/Products/Applications"
          ditto "$BUILT" "$ARC/Products/Applications/$(basename "$BUILT")"
          ARC_APP="$ARC/Products/Applications/$(basename "$BUILT")"
          # The gram binaries were added after flutter sealed the app: seal again.
          for b in "$ARC_APP"/Contents/MacOS/epnd-darwin-*; do
            [ -f "$b" ] && codesign --force --options runtime --sign - "$b"
          done
          codesign --force --options runtime --entitlements macos/Runner/Release.entitlements --sign - "$ARC_APP"
          IP="$ARC_APP/Contents/Info.plist"
          BID=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$IP")
          VER=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$IP" 2>/dev/null || echo 1.0)
          BLD=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$IP" 2>/dev/null || echo 1)
          cat > "$ARC/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>ApplicationProperties</key><dict>
              <key>ApplicationPath</key><string>Applications/$(basename "$BUILT")</string>
              <key>CFBundleIdentifier</key><string>$BID</string>
              <key>CFBundleShortVersionString</key><string>$VER</string>
              <key>CFBundleVersion</key><string>$BLD</string>
              <key>Team</key><string>$TEAM_ID</string>
            </dict>
            <key>ArchiveVersion</key><integer>2</integer>
            <key>CreationDate</key><date>$(date -u +%Y-%m-%dT%H:%M:%SZ)</date>
            <key>Name</key><string>Runner</string>
            <key>SchemeName</key><string>Runner</string>
          </dict></plist>
          PLIST
          cat > "$RUNNER_TEMP/export.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>developer-id</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/export.plist" -exportPath "$RUNNER_TEMP/export" "${AUTH[@]}" | tail -30
          OUT=$(find "$RUNNER_TEMP/export" -maxdepth 1 -name "*.app" | head -1)
          codesign --verify --deep --strict --verbose=2 "$OUT"
          codesign -dvv "$OUT/Contents/MacOS/epnd-darwin-arm64" 2>&1 | grep -E "Authority|TeamIdentifier" || true
          ditto -c -k --keepParent "$OUT" "$RUNNER_TEMP/notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" --key "$KEY" --key-id "$ASC_KEY_ID" --issuer "$ASC_ISSUER_ID" --wait --timeout 30m
          xcrun stapler staple "$OUT"
          spctl --assess --type execute --verbose "$OUT"
          rm -f "$KEY"
          # The signed app replaces the ad hoc one the rest of the job packages.
          rm -rf "$BUILT"
          ditto "$OUT" "$BUILT"
          echo "signing=developer-id" >> "$GITHUB_OUTPUT"

      - name: Sign with Developer ID and notarize
        id: sign
        if: env.MACOS_DEVID_P12 != '' && env.ASC_KEY_ID != '' && env.ASC_ISSUER_ID != '' && env.ASC_KEY_P8 != ''
        run: |
          set -euo pipefail
          APP=$(find build/macos/Build/Products/Release -maxdepth 1 -name "*.app" | head -1)
          KC="$RUNNER_TEMP/signing.keychain-db"; KCPW=$(uuidgen)
          printf '%s' "$MACOS_DEVID_P12" | base64 --decode > "$RUNNER_TEMP/devid.p12"
          security create-keychain -p "$KCPW" "$KC"
          security set-keychain-settings -lut 3600 "$KC"
          security unlock-keychain -p "$KCPW" "$KC"
          security import "$RUNNER_TEMP/devid.p12" -k "$KC" -P "$MACOS_DEVID_P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KCPW" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/devid.p12"
          ID=$(security find-identity -v -p codesigning "$KC" | grep "Developer ID Application" | head -1 | awk '{print $2}')
          test -n "$ID" || { echo "the .p12 holds no Developer ID Application identity"; exit 1; }
          SIGN=(codesign --force --timestamp --options runtime --sign "$ID")
          find "$APP/Contents/Frameworks" -depth \( -name "*.dylib" -o -name "*.framework" \) -print0 | xargs -0 -n1 "${SIGN[@]}"
          for b in "$APP"/Contents/MacOS/epnd-darwin-*; do
            [ -f "$b" ] && "${SIGN[@]}" "$b"
          done
          "${SIGN[@]}" --entitlements macos/Runner/Release.entitlements "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          KEY="$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"
          printf '%s\n' "$ASC_KEY_P8" > "$KEY"
          ditto -c -k --keepParent "$APP" "$RUNNER_TEMP/notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" --key "$KEY" --key-id "$ASC_KEY_ID" --issuer "$ASC_ISSUER_ID" --wait --timeout 30m
          xcrun stapler staple "$APP"
          spctl --assess --type execute --verbose "$APP"
          rm -f "$KEY"
          security delete-keychain "$KC"
          echo "signing=developer-id" >> "$GITHUB_OUTPUT"

      - name: Resolve App Version
        id: version
        run: |
          VERSION=$(sed -nE 's/^version: ([^+]+)\+.*/\1/p' pubspec.yaml)
          echo "version=${VERSION:-1.0.0}" >> "$GITHUB_OUTPUT"

      - name: Package zip
        run: |
          set -euo pipefail
          APP=$(find build/macos/Build/Products/Release -maxdepth 1 -name "*.app" | head -1)
          ditto -c -k --keepParent "$APP" "$GITHUB_WORKSPACE/${{ steps.brand.outputs.artifact_name }}"

      - name: Write Release Metadata
        env:
          EPND_VERSION: ${{ steps.epnd.outputs.version }}
          EPND_ASSET: ${{ steps.epnd.outputs.asset }}
          EPND_SHA256: ${{ steps.epnd.outputs.sha256 }}
        run: |
          node tool/ci/write_release_metadata.mjs \
            --product "${{ steps.brand.outputs.product_id }}" \
            --brand-id "${{ steps.brand.outputs.brand_id }}" \
            --platform "$PLATFORM_ID" \
            --signing "${{ steps.cloudsign.outputs.signing || steps.sign.outputs.signing || 'ad-hoc' }}" \
            --channel "$RELEASE_CHANNEL" \
            --version "${{ steps.version.outputs.version }}" \
            --build-id "${{ github.run_number }}" \
            --source-commit "${{ needs.check.outputs.eapp_sha }}" \
            --contracts-commit "${{ steps.contracts.outputs.sha }}" \
            --release-repo "$RELEASE_REPO" \
            --release-tag "${{ steps.brand.outputs.release_tag }}" \
            --asset "${{ steps.brand.outputs.artifact_name }}" \
            --output "release-metadata.json"
          node tool/ci/write_dependency_manifest.mjs \
            --contracts-commit "${{ steps.contracts.outputs.sha }}" \
            --output "dependency-manifest.json"

      - name: Publish release (self-repo, default token)
        uses: softprops/action-gh-release@v3
        with:
          files: |
            ${{ steps.brand.outputs.artifact_name }}
            release-metadata.json
            dependency-manifest.json
            brand-delivery.json
          tag_name: ${{ steps.brand.outputs.release_tag }}
          name: ${{ steps.brand.outputs.display_name }} macOS ${{ env.RELEASE_CHANNEL }}
          body: |
            ## ${{ steps.brand.outputs.display_name }} macOS ${{ env.RELEASE_CHANNEL }}

            **Source commit:** ${{ needs.check.outputs.eapp_sha }}
            **Contracts:** ${{ steps.contracts.outputs.sha }}
            **Build ID:** ${{ github.run_number }}
            **Channel:** ${{ env.RELEASE_CHANNEL }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout eapp-releases (to write build marker)
        uses: actions/checkout@v4
        with:
          path: .release-meta

      - name: Write + commit build marker
        env:
          EAPP_SHA: ${{ needs.check.outputs.eapp_sha }}
          CONTRACTS_SHA: ${{ needs.check.outputs.contracts_sha }}
          EPND_STATE: ${{ needs.check.outputs.epnd_state }}
          MARKER_PATH: ${{ needs.check.outputs.marker_path }}
          FINGERPRINT: ${{ needs.check.outputs.fingerprint }}
          PARTS: ${{ needs.check.outputs.parts }}
        run: |
          set -euo pipefail
          mkdir -p ".release-meta/$(dirname "$MARKER_PATH")"
          node -e '
            const fs = require("fs");
            fs.writeFileSync(".release-meta/" + process.env.MARKER_PATH, JSON.stringify({
              eapp_sha: process.env.EAPP_SHA,
              contracts_sha: process.env.CONTRACTS_SHA,
              epnd_state: process.env.EPND_STATE,
              fingerprint: process.env.FINGERPRINT,
              parts: JSON.parse(process.env.PARTS || "{}"),
              built_at: new Date().toISOString(),
            }, null, 2) + "\n");
          '
          cd .release-meta
          git config user.name "eutopia-ci"
          git config user.email "ci@50gramx.com"
          git add "$MARKER_PATH"
          git commit -m "ci: mark ${{ inputs.brand_id }}/macos/${{ inputs.release_channel }} built" || exit 0
          # Conflict-safe: several scheduled workflows push this branch. Rebase
          # onto latest and retry each attempt; give up gracefully (build already
          # published, next run catches up).
          for i in $(seq 1 6); do
            git pull --rebase --autostash -q origin main || git rebase --abort || true
            if git push -q origin HEAD:main; then echo "pushed"; exit 0; fi
            echo "push raced (attempt $i) — retrying"; sleep $((RANDOM % 4 + 2))
          done
          echo "gave up after retries (not a failure)"; exit 0

  # A channel whose inputs match a build another channel already made gets
  # that build's release copied over (promote-release.sh), not a rebuild.
  promote:
    needs: [check, build_and_release]
    if: always() && needs.check.outputs.any_promotions == 'true' && (needs.build_and_release.result == 'success' || needs.build_and_release.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Promote
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROMOTIONS: ${{ needs.check.outputs.promotions }}
          FINGERPRINT: ${{ needs.check.outputs.fingerprint }}
          PARTS: ${{ needs.check.outputs.parts }}
        run: |
          set -euo pipefail
          echo "$PROMOTIONS" | node -e 'for (const p of JSON.parse(require("fs").readFileSync(0, "utf8"))) console.log(p.from, p.to)' |
          while read -r from to; do
            bash .github/scripts/promote-release.sh "${{ inputs.brand_id }}" "macos" "$from" "$to" "$FINGERPRINT" "$PARTS"
          done
