name: Build iOS and iPadOS App (unsigned)

# The Evo app for iPhone and iPad, built in CI so no Mac is needed. This repo is
# public, so its macOS runners cost nothing.
#
# What comes out is an UNSIGNED .ipa. Apple only lets a signed app run, so you
# install it with your own Apple ID through a sideloading tool (Sideloadly or
# AltStore). With a free Apple ID that build runs for 7 days; with the paid
# Developer Program it can be signed for TestFlight. Signing in CI needs the
# certificate and profile as secrets, which this workflow does not hold yet.
#
# EVERY BRAND WHOSE CONTRACT HAS AN ios: BLOCK (bundle id + team) is built,
# signed and sent to TestFlight, like the other platforms build every brand.
# The in-app gram is NOT built here: Build epnd publishes libepnd-ios-arm64.a
# to epnd-latest from the same commit as every other epnd, and this build
# downloads and verifies it, the way Android takes its .so.
#
# A brand is rebuilt when eapp-live, the contracts or the published iOS gram
# changed since its last build (data/last-built/<brand>-ios.json); checked
# every six hours, and on demand.
on:
  workflow_dispatch:
    inputs:
      brand_id:
        description: One brand (blank = every brand whose contract declares iOS)
        required: false
        default: ''
        type: string
      release_channel:
        description: Release channel
        required: false
        default: nightly
        type: string
  schedule:
    - cron: '41 */6 * * *'

permissions:
  contents: write

concurrency:
  group: build-eapp-ios
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      brands: ${{ steps.compare.outputs.brands }}
      any: ${{ steps.compare.outputs.any }}
      eapp_sha: ${{ steps.state.outputs.eapp_sha }}
      contracts_sha: ${{ steps.state.outputs.contracts_sha }}
      epnd_state: ${{ steps.state.outputs.epnd_state }}
    steps:
      - uses: actions/checkout@v4

      - name: Checkout brand contracts
        uses: actions/checkout@v4
        with:
          repository: 50gramx/eapp-interaction-contracts
          token: ${{ secrets.CI_READ_TOKEN }}
          path: contracts

      - name: Current state of what an iOS app is made from
        id: state
        env:
          GH_TOKEN: ${{ secrets.CI_READ_TOKEN }}
        run: |
          set -euo pipefail
          echo "eapp_sha=$(gh api repos/50gramx/eapp-live/commits/main --jq .sha)" >> "$GITHUB_OUTPUT"
          echo "contracts_sha=$(git -C contracts rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          state=$(curl -fsSL https://github.com/50gramx/eapp-releases/releases/download/epnd-latest/libepnd-ios-arm64.sha256 | sha256sum | awk '{print $1}')
          echo "epnd_state=$state" >> "$GITHUB_OUTPUT"

      - name: Brands to build
        id: compare
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ONLY: ${{ inputs.brand_id }}
          FORCED: ${{ github.event_name == 'workflow_dispatch' }}
          NOW: ${{ steps.state.outputs.eapp_sha }} ${{ steps.state.outputs.contracts_sha }} ${{ steps.state.outputs.epnd_state }}
        run: |
          python3 -c "import yaml" 2>/dev/null || pip install -q pyyaml
          python3 .github/ios_brands.py

  build:
    needs: check
    if: needs.check.outputs.any == 'true'
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        brand: ${{ fromJSON(needs.check.outputs.brands) }}
    env:
      # App Store Connect API key (Admin), pasted by the account holder into this
      # repo's secrets. With it the build is signed and sent to TestFlight; without
      # it the unsigned .ipa below is all that comes out.
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      BRAND_ID: ${{ matrix.brand }}
      RELEASE_CHANNEL: ${{ inputs.release_channel || 'nightly' }}
    steps:
      - name: Checkout eapp-live (private, read-only token)
        uses: actions/checkout@v4
        with:
          repository: 50gramx/eapp-live
          token: ${{ secrets.CI_READ_TOKEN }}
          ref: ${{ needs.check.outputs.eapp_sha }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.3'
          channel: stable
          cache: true

      - name: Private dependencies
        run: git config --global url."https://${{ secrets.CI_READ_TOKEN }}@github.com/".insteadOf "https://github.com/"

      - name: Dependencies
        # A CACHED CLONE OF A PRIVATE PACKAGE IS NOT REUSED. The pub cache kept a
        # clone of bharatsphere-app whose remote had no ".git"; GitHub redirects
        # that to ".../bharatsphere-app.git/", git drops the token on the
        # redirect, and the fetch failed with "could not read Username" (iOS build
        # 2026-11-05 07:22 UTC) as soon as main moved. Cloned fresh, from the URL
        # in pubspec.yaml, the token above applies.
        run: |
          rm -rf "$PUB_CACHE"/git/cache/bharatsphere-app-*
          flutter pub get

      # WHO THE APP IS comes from the brand contract, never from this file: the
      # bundle id App Store Connect knows it by, its team, its name on the home
      # screen. (Flutter's template left com.example.eappLive in the project.)
      - name: Checkout brand contracts
        uses: actions/checkout@v4
        with:
          repository: 50gramx/eapp-interaction-contracts
          token: ${{ secrets.CI_READ_TOKEN }}
          path: .ci/eapp-interaction-contracts

      - name: Resolve the brand
        id: brand
        run: |
          node tool/ci/resolve_contract_delivery.mjs             --contracts-root ".ci/eapp-interaction-contracts"             --brand-id "$BRAND_ID" --platform ios --channel "$RELEASE_CHANNEL"             --github-output "$GITHUB_OUTPUT" --output brand-delivery.json

      - name: Brand the iOS project
        env:
          BUNDLE_ID: ${{ steps.brand.outputs.ios_bundle_id }}
          TEAM_ID: ${{ steps.brand.outputs.ios_team_id }}
          DISPLAY: ${{ steps.brand.outputs.ios_display_name || steps.brand.outputs.brand_display_name }}
        run: |
          set -euo pipefail
          test -n "$BUNDLE_ID" || { echo "the brand contract names no iOS bundle id"; exit 1; }
          PBX=ios/Runner.xcodeproj/project.pbxproj
          # The app target and its tests; the tests keep their own suffix.
          sed -i '' "s/PRODUCT_BUNDLE_IDENTIFIER = com.example.eappLive;/PRODUCT_BUNDLE_IDENTIFIER = $BUNDLE_ID; DEVELOPMENT_TEAM = $TEAM_ID; CODE_SIGN_STYLE = Automatic;/" "$PBX"
          sed -i '' "s/PRODUCT_BUNDLE_IDENTIFIER = com.example.eappLive.RunnerTests;/PRODUCT_BUNDLE_IDENTIFIER = $BUNDLE_ID.RunnerTests;/" "$PBX"
          grep -c "PRODUCT_BUNDLE_IDENTIFIER = $BUNDLE_ID;" "$PBX"
          P=ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName $DISPLAY" "$P"
          # Only standard HTTPS/TLS: no export-compliance question per build.
          /usr/libexec/PlistBuddy -c "Delete :ITSAppUsesNonExemptEncryption" "$P" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" "$P"
          echo "bundle $BUNDLE_ID, team $TEAM_ID, shown as $DISPLAY"

      # The world asks for the camera, location, motion and microphone. iOS ends
      # any app that asks without saying why, so the reasons go in first.
      - name: Say why the app asks for each sensor
        run: |
          set -euo pipefail
          P=ios/Runner/Info.plist
          # plutil takes the text as its own argument. PlistBuddy parsed it as a
          # command, and an apostrophe ("region's") silently dropped the key:
          # build 1007 was refused for NSPhotoLibraryUsageDescription.
          put(){
            plutil -replace "$1" -string "$2" "$P"
            test "$(plutil -extract "$1" raw -o - "$P")" = "$2" || { echo "$1 did not land in $P"; exit 1; }
          }
          put NSCameraUsageDescription "Capture photos of a place so the network can build its 3D map."
          put NSLocationWhenInUseUsageDescription "Place you on the map and tag each photo with where it was taken."
          put NSMotionUsageDescription "Use the compass and motion to face the map the way you face."
          put NSMicrophoneUsageDescription "Talk with Evo and people standing in the same region."
          # App Store Connect refuses an upload whose code can reach a protected
          # API without a reason, whether or not the app ever calls it.
          put NSPhotoLibraryUsageDescription "Choose photos to share or to add to a region's map."
          put NSPhotoLibraryAddUsageDescription "Save photos and captures you make in the app."
          put NSLocationAlwaysAndWhenInUseUsageDescription "Place you on the map and tag each photo with where it was taken."
          put NSLocationAlwaysUsageDescription "Place you on the map and tag each photo with where it was taken."
          put NSBluetoothAlwaysUsageDescription "Find nearby devices of yours on the network."
          put NSContactsUsageDescription "Invite people you know to your gramx."
          put NSCalendarsUsageDescription "Add events from your gramx to your calendar."
          put NSSpeechRecognitionUsageDescription "Turn what you say to Evo into text."
          put NSFaceIDUsageDescription "Unlock your keys on this device."
          put NSLocalNetworkUsageDescription "Reach your own grams on the same network."

      # The gram inside the app, as Build epnd published it (its ios-lib job):
      # downloaded, checked against its .sha256, linked by the epnd_ios plugin.
      # An app without its gram is not shipped.
      - name: Fetch the in-app gram from epnd-latest
        run: |
          set -euo pipefail
          cd ios/epnd_ios/ios
          base=https://github.com/50gramx/eapp-releases/releases/download/epnd-latest
          for f in libepnd-ios-arm64.sha256 libepnd-ios-arm64.a libepnd-ios-arm64.version; do
            curl -fsSL --retry 4 -o "$f" "$base/$f"
          done
          shasum -a 256 -c libepnd-ios-arm64.sha256
          mv libepnd-ios-arm64.a libepnd.a
          mv libepnd-ios-arm64.version EPND_VERSION
          rm libepnd-ios-arm64.sha256
          echo "in-app gram: $(cat EPND_VERSION), $(du -h libepnd.a | cut -f1)"

      - name: Pods
        run: |
          cd ios
          pod install --repo-update

      # THE APP IS THE BRAND'S: the same contract-resolved defines the Android
      # build passes. Without them every iOS build came out as the default brand
      # (evo), whatever bundle id it was signed under.
      - name: Build (no signing)
        run: |
          set -euo pipefail
          DEFINES=(
            --dart-define=BRAND_ID="${{ steps.brand.outputs.brand_id }}"
            --dart-define=ENVIRONMENT="${{ steps.brand.outputs.brand_environment }}"
            --dart-define=BRAND_DISPLAY_NAME="${{ steps.brand.outputs.brand_display_name }}"
            --dart-define=BRAND_PRODUCT_NAME="${{ steps.brand.outputs.brand_product_name }}"
            --dart-define=BRAND_WINDOW_TITLE="${{ steps.brand.outputs.brand_window_title }}"
            --dart-define=BRAND_LOGO="${{ steps.brand.outputs.brand_logo }}"
            --dart-define=BRAND_SESSION_FILE="${{ steps.brand.outputs.brand_session_file }}"
            --dart-define=BRAND_SINGLETON_NAME="${{ steps.brand.outputs.brand_singleton_name }}"
            --dart-define=BRAND_ORGANISATION="${{ steps.brand.outputs.brand_organisation }}"
            --dart-define=BRAND_COMMUNITY_CODE="${{ steps.brand.outputs.brand_community_code }}"
            --dart-define=BRAND_SHOW_APP_LIBRARY="${{ steps.brand.outputs.brand_show_app_library }}"
            --dart-define=BRAND_SHOW_PRIVATE_SPACE_TILE="${{ steps.brand.outputs.brand_show_private_space_tile }}"
            --dart-define=BRAND_SHOW_HISTORY="${{ steps.brand.outputs.brand_show_history }}"
            --dart-define=BRAND_SHOW_PANE_SWITCHER="${{ steps.brand.outputs.brand_show_pane_switcher }}"
            --dart-define=BRAND_SHOW_SPOTLIGHT="${{ steps.brand.outputs.brand_show_spotlight }}"
            --dart-define=BRAND_SHOW_OPEN_TABS_SUMMARY="${{ steps.brand.outputs.brand_show_open_tabs_summary }}"
            --dart-define=BRAND_SHOW_OPEN_COMMUNITIES_SUMMARY="${{ steps.brand.outputs.brand_show_open_communities_summary }}"
            --dart-define=BRAND_SHOW_USER_DETAILS="${{ steps.brand.outputs.brand_show_user_details }}"
            --dart-define=BRAND_SHOW_OPEN_PAGES_TABS="${{ steps.brand.outputs.brand_show_open_pages_tabs }}"
            --dart-define=BRAND_CLEAR_SESSION_ON_START="${{ steps.brand.outputs.brand_clear_session_on_start }}"
            --dart-define=BRAND_UNBOUNDED_SOLUTION_NAV="${{ steps.brand.outputs.brand_unbounded_solution_nav }}"
            --dart-define=BRAND_SHOW_WALLPAPER_CREDIT="${{ steps.brand.outputs.brand_show_wallpaper_credit }}"
            --dart-define=BRAND_SHOW_AUTO_APP_SELECTOR="${{ steps.brand.outputs.brand_show_auto_app_selector }}"
            --dart-define=BRAND_PREFERRED_WALLPAPER="${{ steps.brand.outputs.brand_preferred_wallpaper }}"
            --dart-define=BRAND_NAVIGATION_JSON_B64="${{ steps.brand.outputs.brand_navigation_json_b64 }}"
          )
          # Version is the date, the build number the run: both always increase.
          flutter build ios --release --no-codesign --dart-define=BUILD_ID=${{ github.run_number }} "${DEFINES[@]}" \
            --build-name "$(date -u +%y.%-m.%-d)" --build-number "$((1000 + ${{ github.run_number }}))"

      # SIGNED, TO TESTFLIGHT. Xcode signs with the team's own certificate and
      # profile, created and kept by Apple ("cloud-managed"), authorised by the
      # API key -- no certificate or profile is stored anywhere here.
      - name: Archive, sign and upload to TestFlight
        if: env.ASC_KEY_ID != '' && env.ASC_ISSUER_ID != '' && env.ASC_KEY_P8 != ''
        env:
          TEAM_ID: ${{ steps.brand.outputs.ios_team_id }}
        run: |
          set -euo pipefail
          KEY="$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"
          printf '%s\n' "$ASC_KEY_P8" > "$KEY"
          AUTH=(-allowProvisioningUpdates -authenticationKeyPath "$KEY" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID")
          xcodebuild -workspace ios/Runner.xcworkspace -scheme Runner -configuration Release             -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/Runner.xcarchive" archive "${AUTH[@]}" | tail -40
          cat > "$RUNNER_TEMP/export.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Runner.xcarchive"             -exportOptionsPlist "$RUNNER_TEMP/export.plist" -exportPath "$RUNNER_TEMP/export" "${AUTH[@]}" | tail -40
          rm -f "$KEY"
          echo "uploaded: it shows in TestFlight once Apple has processed it (usually 5-30 min)"

      - name: Package .ipa
        run: |
          set -euo pipefail
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qry "$BRAND_ID-ios-unsigned.ipa" Payload
          ls -la "$BRAND_ID-ios-unsigned.ipa"

      # THE RELEASES PAGE LISTS iOS LIKE EVERY OTHER PLATFORM: the same
      # release-metadata.json the catalog reads for Android and desktop. The .ipa
      # here is unsigned (sideloading); the signed build is in TestFlight, which
      # the page links when the brand's contract names its public link.
      - name: Release metadata
        run: |
          set -euo pipefail
          node tool/ci/write_release_metadata.mjs \
            --product "${{ steps.brand.outputs.product_id }}" \
            --brand-id "$BRAND_ID" \
            --platform ios \
            --signing none \
            --channel "$RELEASE_CHANNEL" \
            --version "$(date -u +%y.%-m.%-d)" \
            --build-id "$((1000 + ${{ github.run_number }}))" \
            --source-commit "${{ needs.check.outputs.eapp_sha }}" \
            --contracts-commit "${{ needs.check.outputs.contracts_sha }}" \
            --release-repo 50gramx/eapp-releases \
            --release-tag "$BRAND_ID-ios-latest" \
            --asset "$BRAND_ID-ios-unsigned.ipa" \
            --output release-metadata.json

      - name: Publish
        uses: softprops/action-gh-release@v3
        with:
          files: |
            ${{ matrix.brand }}-ios-unsigned.ipa
            release-metadata.json
          tag_name: ${{ matrix.brand }}-ios-latest
          name: ${{ matrix.brand }} for iPhone and iPad (unsigned)
          prerelease: true
          body: |
            Unsigned build of eapp-live ${{ needs.check.outputs.eapp_sha }}, run ${{ github.run_number }}.
            Install with Sideloadly or AltStore using your Apple ID. A free Apple ID runs it for 7 days.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout eapp-releases (marker)
        uses: actions/checkout@v4
        with:
          path: .release-meta

      - name: Record this build
        env:
          EAPP_SHA: ${{ needs.check.outputs.eapp_sha }}
          CONTRACTS_SHA: ${{ needs.check.outputs.contracts_sha }}
          EPND_STATE: ${{ needs.check.outputs.epnd_state }}
        run: |
          set -euo pipefail
          mkdir -p .release-meta/data/last-built
          printf '{\n  "eapp_sha": "%s",\n  "contracts_sha": "%s",\n  "epnd_state": "%s",\n  "built_at": "%s"\n}\n' \
            "$EAPP_SHA" "$CONTRACTS_SHA" "$EPND_STATE" "$(date -u +%FT%TZ)" > ".release-meta/data/last-built/$BRAND_ID-ios.json"
          cd .release-meta
          git config user.name "eutopia-ci"
          git config user.email "ci@50gramx.com"
          git add "data/last-built/$BRAND_ID-ios.json"
          git commit -m "ci: mark $BRAND_ID/ios built" || exit 0
          for i in $(seq 1 6); do
            git pull --rebase --autostash -q origin main || git rebase --abort || true
            if git push -q origin HEAD:main; then exit 0; fi
            sleep $((RANDOM % 4 + 2))
          done
