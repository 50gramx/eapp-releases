name: Build epnd

# Mirrors private epn-daemon/.github/workflows/release.yml exactly. Private
# repo is untouched — we just poll its latest `main` SHA (via CI_READ_TOKEN,
# read-only) and only rebuild when it moves.
# A marker of "<epn-daemon sha> <scripts hash>" is kept in `epnd-last-built.txt`
# on this repo's main. It covers the SCRIPTS as well as the daemon because this
# workflow publishes both -- watching only the daemon meant a fix to install.ps1
# or epnd-autoupdate.ps1 could never ship on its own.
#
# Automatic behavior: Publishes new epnd when epn-daemon main moves.
# Manual option: Can cascade to rebuild all brand/platform combos (for critical updates).
# Routine rebuilds: Handled by build-cadence.yml on nightly/weekly/bi-weekly/stable schedule.
on:
  schedule:
    # Offset off the :00/:15/:30/:45 marks — those are the most congested
    # minutes across all of GitHub's scheduled-workflow queue (shared by
    # every repo on the platform) and schedules there are frequently delayed
    # or dropped entirely (documented GitHub Actions behavior). 7/22/37/52
    # still gives a ~15-min cadence without competing for that exact slot.
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
    inputs:
      cascade_app_builds:
        description: Rebuild all brand/platform combos with new epnd (for critical updates)
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  actions: write   # to dispatch app rebuilds when manually requested

# A push to epn-daemon now starts this at once (epn-daemon's
# trigger-gram-build.yml); the schedule above stays as the backstop.
#
# NO LOCK ON THE WHOLE RUN. One was tried (13 Nov) and made every new build
# wait for the previous run's iOS job, which sits in GitHub's macOS queue for
# minutes. Only `publish` is serialized, and ios-lib yields to newer runs.

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.latest.outputs.sha }}
      should_build: ${{ steps.compare.outputs.should_build }}
      marker: ${{ steps.compare.outputs.marker }}
    steps:
      - uses: actions/checkout@v4

      - name: Get latest epn-daemon main SHA
        id: latest
        env:
          GH_TOKEN: ${{ secrets.CI_READ_TOKEN }}
        run: |
          sha=$(gh api repos/50gramx/epn-daemon/commits/main --jq .sha)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Hash the scripts this workflow publishes
        id: scripts
        run: |
          set -euo pipefail
          # THE MARKER MUST COVER EVERYTHING THE RELEASE CONTAINS.
          #
          # This workflow publishes install/update scripts from THIS repo
          # alongside the binaries, but change detection used to watch only
          # epn-daemon's SHA. So a fix to install.ps1 or epnd-autoupdate.ps1
          # could never ship on its own: with the marker already equal to
          # epn-daemon HEAD, every scheduled run skipped, and the corrected
          # script sat in git forever while nodes kept downloading the broken
          # one. That is how the em-dash bug survived its own fix.
          #
          # THIS WORKFLOW IS PART OF WHAT THE RELEASE CONTAINS.
          #
          # The marker is what decides whether a build happens at all, so
          # anything that changes the CONTENTS of the release has to be in it.
          # The file listing those contents is this one. Adding the world
          # viewer to the publish list without hashing this file would have
          # left the marker equal to its old value on every subsequent run:
          # should_build=false forever, the viewer never published, and the
          # site's download of it failing indefinitely against a release that
          # was never going to gain the asset. Same shape of bug as the
          # scripts hash above was written to prevent, one level up.
          h=$(cat scripts/install.sh scripts/install.ps1                   scripts/epnd-autoupdate.sh scripts/epnd-autoupdate.ps1                   .github/workflows/build-epnd.yml               | sha256sum | cut -d' ' -f1)
          echo "hash=$h" >> "$GITHUB_OUTPUT"

      - name: Compare against last built marker
        id: compare
        env:
          GH_TOKEN: ${{ secrets.CI_READ_TOKEN }}
        run: |
          # True when every file changed between two epn-daemon commits is
          # documentation. Any doubt (API error, a list GitHub truncated at
          # 300 files) answers false, which builds: never skip on a guess.
          docs_only() {
            local files
            files=$(gh api "repos/50gramx/epn-daemon/compare/$1...$2" \
              --jq 'if (.files|length) >= 300 then "TRUNCATED" else .files[].filename end' 2>/dev/null) || return 1
            [ -n "$files" ] || return 1
            echo "$files" | grep -q TRUNCATED && return 1
            # Docs only when nothing is left after removing the docs lines.
            [ -z "$(echo "$files" | grep -vE '^docs/|\.md$')" ]
          }
          # The marker is "<epn-daemon sha> <scripts hash>". A first line alone
          # is an older marker: treat it as a scripts mismatch so the next run
          # republishes once and settles.
          last=$(cat epnd-last-built.txt 2>/dev/null || echo "")
          want="${{ steps.latest.outputs.sha }} ${{ steps.scripts.outputs.hash }}"
          if [ "$last" = "$want" ]; then
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          elif [ "${last#* }" = "${{ steps.scripts.outputs.hash }}" ] && [ -n "${last%% *}" ] && docs_only "${last%% *}" "${{ steps.latest.outputs.sha }}"; then
            # NOTHING THE BINARY IS MADE OF CHANGED. A commit touching only
            # docs/ or Markdown builds a byte-identical epnd, yet a new SHA is
            # a new "build" to every gram: each one downloads it and restarts.
            # On 13 Nov a docs commit (fde5ef48) did exactly that and killed a
            # site publish in progress. The marker stays where it is, so the
            # next code change is compared from the last real build.
            echo "only docs changed since ${last%% *}; nothing to build"
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          fi
          echo "marker=$want" >> "$GITHUB_OUTPUT"

  # ── BUILT IN PARALLEL, CACHED, PUBLISHED ONCE (13 Nov) ─────────────────
  #
  # Until 13 Nov one job did everything in sequence and from cold, ~16 min:
  #   2:39 cloning this repo's full 2 GB history (heartbeat commits), unneeded
  #   1:37 vet, then 5:45 for five desktop targets one after another, then
  #   3:24 for three Android ABIs, then the viewer, then 1:03 of serial uploads
  # and NO Go cache at all: setup-go looked for go.sum at this repo's root
  # ("Restore cache failed: Dependencies file is not found"), and installed Go
  # 1.22 only for every run to download the 1.26 epn-daemon's go.mod asks for.
  #
  # Now vet, each binary and the viewer are separate jobs that run at once,
  # each with its own Go build cache keyed on epn-daemon's go.sum, and Go is
  # taken from epn-daemon's go.mod. `publish` waits for all of them -- vet
  # still gates every public binary -- stages, uploads in parallel (binaries
  # first, checksums.txt only after every binary is up, so a gram never reads
  # new checksums beside an old file), and writes the marker.
  vet:
    needs: check
    if: needs.check.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    env:
      GOPRIVATE: 'github.com/50gramx/*,epn.io/*'
    steps:
      - name: Checkout epn-daemon source (private, read-only token)
        uses: actions/checkout@v4
        with:
          repository: 50gramx/epn-daemon
          token: ${{ secrets.CI_READ_TOKEN }}
          ref: ${{ needs.check.outputs.sha }}
          path: epn-daemon
      - uses: actions/setup-go@v5
        with:
          go-version-file: epn-daemon/go.mod
          cache: false
      - uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-vet-${{ hashFiles('epn-daemon/go.sum') }}
          restore-keys: go-vet-
      - name: Configure git for private Go deps
        run: git config --global url."https://${{ secrets.CI_READ_TOKEN }}@github.com/".insteadOf "https://github.com/"
      # Fetched before anything judges the code, and retried: proxy.golang.org
      # drops a stream now and then, and vet reports that as broken code.
      - name: Download modules (retried — the proxy is not always up)
        working-directory: epn-daemon
        run: |
          for i in 1 2 3; do
            if go mod download all; then exit 0; fi
            echo "module download failed (attempt $i) — retrying"; sleep 15
          done
          echo "module download failed three times; the proxy is not reachable" >&2; exit 1
      - name: Gate — vet must pass before we publish a public binary
        working-directory: epn-daemon
        run: go vet ./...

  bin:
    needs: check
    if: needs.check.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - { goos: windows, goarch: amd64, out: epnd-windows-amd64.exe }
          - { goos: linux,   goarch: amd64, out: epnd-linux-amd64 }
          - { goos: linux,   goarch: arm64, out: epnd-linux-arm64 }
          - { goos: darwin,  goarch: amd64, out: epnd-darwin-amd64 }
          - { goos: darwin,  goarch: arm64, out: epnd-darwin-arm64 }
          # Android runs the daemon in lite mode, inside the APK as a jniLibs
          # .so exec'd from nativeLibraryDir: a real Android PIE binary, which
          # needs CGO and the NDK (a CGO_ENABLED=0 GOOS=android build fails
          # linking libp2p's wlynxg/anet netlink helper).
          - { goos: android, goarch: arm64, out: epnd-android-arm64-v8a,   cc: aarch64-linux-android21-clang }
          - { goos: android, goarch: arm,   out: epnd-android-armeabi-v7a, cc: armv7a-linux-androideabi21-clang, goarm: '7' }
          - { goos: android, goarch: amd64, out: epnd-android-x86_64,      cc: x86_64-linux-android21-clang }
    env:
      GOPRIVATE: 'github.com/50gramx/*,epn.io/*'
    steps:
      - name: Checkout epn-daemon source (private, read-only token)
        uses: actions/checkout@v4
        with:
          repository: 50gramx/epn-daemon
          token: ${{ secrets.CI_READ_TOKEN }}
          ref: ${{ needs.check.outputs.sha }}
          path: epn-daemon
      - uses: actions/setup-go@v5
        with:
          go-version-file: epn-daemon/go.mod
          cache: false
      # One cache per target: a build cache holds what one GOOS/GOARCH
      # compiled. Keyed on go.sum, so dependencies (most of the compile) come
      # back warm and only changed packages rebuild.
      - uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ matrix.goos }}-${{ matrix.goarch }}-${{ hashFiles('epn-daemon/go.sum') }}
          restore-keys: go-${{ matrix.goos }}-${{ matrix.goarch }}-
      - name: Configure git for private Go deps
        run: git config --global url."https://${{ secrets.CI_READ_TOKEN }}@github.com/".insteadOf "https://github.com/"
      - name: Download modules (retried)
        working-directory: epn-daemon
        run: |
          for i in 1 2 3; do
            if go mod download; then exit 0; fi
            echo "module download failed (attempt $i) — retrying"; sleep 15
          done
          exit 1
      # The runner image ships NDK r26d (26.3.11579264); downloading it again
      # was half of each Android job. Downloaded only if the image lacks it.
      - name: Find the runner's NDK r26d
        if: matrix.goos == 'android'
        id: ndkpre
        run: |
          d="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}/ndk/26.3.11579264"
          if [ -x "$d/toolchains/llvm/prebuilt/linux-x86_64/bin/clang" ]; then
            echo "path=$d" >> "$GITHUB_OUTPUT"; echo "using the image's NDK at $d"
          else
            echo "the image has no NDK r26d; it will be downloaded"
          fi
      - name: Setup Android NDK
        if: matrix.goos == 'android' && steps.ndkpre.outputs.path == ''
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d
          # MUST be false: local-cache round-trips the NDK through tar, which
          # breaks the `clang` symlink (clang -> clang-17).
          local-cache: false
      - name: Build ${{ matrix.out }}
        working-directory: epn-daemon
        env:
          NDK: ${{ steps.ndkpre.outputs.path || steps.ndk.outputs.ndk-path }}
        run: |
          set -euo pipefail
          SHA="${{ needs.check.outputs.sha }}"
          mkdir -p dist
          export GOOS="${{ matrix.goos }}" GOARCH="${{ matrix.goarch }}"
          if [ "$GOOS" = android ]; then
            TC="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
            if [ ! -x "$TC/${{ matrix.cc }}" ]; then
              echo "::error::NDK compiler missing: $TC/${{ matrix.cc }}"; ls -la "$TC" | head -40; exit 1
            fi
            export CGO_ENABLED=1 CC="$TC/${{ matrix.cc }}"
            [ -n "${{ matrix.goarm }}" ] && export GOARM="${{ matrix.goarm }}"
            # -checklinkname=0: Go 1.23+ rejects //go:linkname to unexported
            # stdlib symbols; go-libp2p's Android dep (wlynxg/anet) links to
            # net.zoneCache on purpose. Android only.
            LDX="-checklinkname=0"
          else
            export CGO_ENABLED=0
            LDX=""
          fi
          go build -trimpath -ldflags "-s -w $LDX -X epn.io/daemon/internal/cmd.Version=$SHA" \
            -o "dist/${{ matrix.out }}" ./cmd/epnd
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.out }}
          path: epn-daemon/dist/${{ matrix.out }}
          retention-days: 3
          compression-level: 0

  # /world on the brand site loads the same page a gram serves at /v1/world,
  # from a Go program compiled to wasm: daemon code, built with the daemon.
  viewer:
    needs: check
    if: needs.check.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    env:
      GOPRIVATE: 'github.com/50gramx/*,epn.io/*'
    steps:
      - name: Checkout epn-daemon source (private, read-only token)
        uses: actions/checkout@v4
        with:
          repository: 50gramx/epn-daemon
          token: ${{ secrets.CI_READ_TOKEN }}
          ref: ${{ needs.check.outputs.sha }}
          path: epn-daemon
      - uses: actions/setup-go@v5
        with:
          go-version-file: epn-daemon/go.mod
          cache: false
      - uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-js-wasm-${{ hashFiles('epn-daemon/go.sum') }}
          restore-keys: go-js-wasm-
      - name: Configure git for private Go deps
        run: git config --global url."https://${{ secrets.CI_READ_TOKEN }}@github.com/".insteadOf "https://github.com/"
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build the world viewer (js/wasm)
        working-directory: epn-daemon/web/shell
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          bash build.sh dist
          mv dist/index.html dist/world-viewer.html
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: viewer
          path: |
            epn-daemon/web/shell/dist/epn.wasm
            epn-daemon/web/shell/dist/wasm_exec.js
            epn-daemon/web/shell/dist/epn-shell.js
            epn-daemon/web/shell/dist/world-viewer.html
          retention-days: 3

  publish:
    needs: [check, vet, bin, viewer]
    if: needs.check.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    # One release written at a time, queued not cancelled.
    concurrency:
      group: epnd-publish
      cancel-in-progress: false
    steps:
      # This repo's history is ~2 GB of status commits; only the tip is needed
      # (the marker commit re-fetches and resets to origin/main itself).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Checkout epn-daemon source (private, read-only token)
        uses: actions/checkout@v4
        with:
          repository: 50gramx/epn-daemon
          token: ${{ secrets.CI_READ_TOKEN }}
          ref: ${{ needs.check.outputs.sha }}
          path: epn-daemon
          # Enough history for epnd-commits.txt (staged below).
          fetch-depth: 500
      - uses: actions/download-artifact@v4
        with:
          pattern: bin-*
          path: epn-daemon/dist
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: viewer
          path: epn-daemon/dist
      - name: PowerShell scripts must be pure ASCII
        run: |
          set -euo pipefail
          python3 scripts/check-ps1-ascii.py 'scripts/*.ps1'
          if command -v pwsh >/dev/null 2>&1; then
            for f in scripts/*.ps1; do
              pwsh -NoProfile -Command "\$e = \$null; [void][System.Management.Automation.Language.Parser]::ParseFile('$f', [ref]\$null, [ref]\$e); if (\$e.Count) { \$e | ForEach-Object { Write-Host \$_.Message }; exit 1 }" \
                || { echo "::error file=$f::does not parse"; exit 1; }
            done
          fi
      - name: Stage installer + checksums
        run: |
          set -euo pipefail
          cp scripts/install.sh scripts/install.ps1 scripts/epnd-autoupdate.sh scripts/epnd-autoupdate.ps1 epn-daemon/dist/
          cp epn-daemon/scripts/report-bootstrap-status.sh epn-daemon/dist/
          chmod +x epn-daemon/dist/epnd-linux-* epn-daemon/dist/epnd-darwin-* epn-daemon/dist/epnd-android-* || true
          git -C epn-daemon log --format=%H -n 500 > epn-daemon/dist/epnd-commits.txt
          cd epn-daemon/dist
          for f in epnd-windows-amd64.exe epnd-linux-amd64 epnd-linux-arm64 epnd-darwin-amd64 epnd-darwin-arm64 \
                   epnd-android-arm64-v8a epnd-android-armeabi-v7a epnd-android-x86_64 \
                   epn.wasm wasm_exec.js epn-shell.js world-viewer.html; do
            [ -s "$f" ] || { echo "::error::$f is missing from the build"; exit 1; }
          done
          sha256sum epnd-* install.sh install.ps1 report-bootstrap-status.sh \
            epn.wasm wasm_exec.js epn-shell.js world-viewer.html > checksums.txt
          ls -la
      - name: Publish (rolling epnd-latest)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          cd epn-daemon/dist
          tag=epnd-latest
          if ! gh release view "$tag" --repo "$REPO" >/dev/null 2>&1; then
            gh release create "$tag" --repo "$REPO" --title "epnd — Latest Build (Rolling)" --notes-file ../scripts/release-notes.md
          else
            gh release edit "$tag" --repo "$REPO" --title "epnd — Latest Build (Rolling)" --notes-file ../scripts/release-notes.md
          fi
          up() {
            for attempt in 1 2 3 4 5; do
              gh release upload "$tag" "$1" --repo "$REPO" --clobber && return 0
              echo "::warning file=$1::upload attempt $attempt failed; retrying"; sleep $((attempt * 20))
            done
            echo "$1" >> ../upload-failed.txt; return 0
          }
          export -f up; export tag REPO
          rm -f ../upload-failed.txt
          # Everything but the checksums and the commit list, four at a time.
          printf '%s\n' epnd-windows-amd64.exe epnd-linux-amd64 epnd-linux-arm64 epnd-darwin-amd64 epnd-darwin-arm64 \
            epnd-android-arm64-v8a epnd-android-armeabi-v7a epnd-android-x86_64 \
            install.sh install.ps1 report-bootstrap-status.sh epnd-autoupdate.sh epnd-autoupdate.ps1 \
            epn.wasm wasm_exec.js epn-shell.js world-viewer.html \
            | xargs -P 4 -I{} bash -c 'up "$1"' _ {}
          if [ -s ../upload-failed.txt ]; then
            echo "::error::assets not published after retries: $(tr '\n' ' ' < ../upload-failed.txt)"; exit 1
          fi
          # Last, so a gram never reads checksums for files not yet replaced.
          up checksums.txt; up epnd-commits.txt
          if [ -s ../upload-failed.txt ]; then
            echo "::error::assets not published after retries: $(tr '\n' ' ' < ../upload-failed.txt)"; exit 1
          fi
      - name: Commit marker
        run: |
          git config user.name "eutopia-ci"
          git config user.email "ci@50gramx.com"
          for i in $(seq 1 6); do
            git fetch -q --depth=1 origin main
            git reset -q --hard origin/main
            echo "${{ needs.check.outputs.marker }}" > epnd-last-built.txt
            if git diff --quiet -- epnd-last-built.txt; then
              echo "marker already current"; exit 0
            fi
            git add epnd-last-built.txt
            git commit -q -m "ci: built epnd @ ${{ needs.check.outputs.sha }}"
            if git push -q origin HEAD:main; then
              echo "pushed"; exit 0
            fi
            echo "push raced (attempt $i) — re-syncing"; sleep $((RANDOM % 4 + 2))
          done
          echo "gave up after retries — next run will catch up (not a failure)"; exit 0
      - name: Refresh bundled-epnd app builds (manual cascade for critical updates)
        if: github.event_name == 'workflow_dispatch' && inputs.cascade_app_builds == 'true'
        # When manually triggered with cascade_app_builds=true: rebuild every
        # brand/platform/channel combo that has shipped before (per data/catalog.json),
        # so the *initial* epnd bundled into each app installer is current.
        # (Already-installed apps don't need this — they self-update epnd at runtime
        # via DaemonUpdater — this is purely about new installs getting the latest
        # daemon out of the box.) Used for critical epnd updates only.
        #
        # For routine updates: build-cadence.yml handles all rebuilds on nightly/weekly/
        # bi-weekly/stable schedule. Change-detection skips rebuilds when epnd state
        # hasn't changed, so no wasted builds.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          node -e '
            const fs = require("fs");
            const catalog = JSON.parse(fs.readFileSync("data/catalog.json", "utf8"));
            const combos = [];
            for (const product of catalog.products || []) {
              for (const r of product.releases || []) {
                combos.push({ brandId: product.brandId, platform: r.platform, channel: r.channel });
              }
            }
            fs.writeFileSync("/tmp/combos.json", JSON.stringify(combos));
          '
          node -e 'process.stdout.write(JSON.parse(require("fs").readFileSync("/tmp/combos.json")).map(c=>`${c.brandId} ${c.platform} ${c.channel}`).join("\n"))' > /tmp/combos.txt
          combos_count=$(wc -l < /tmp/combos.txt)
          echo "Cascading to $combos_count brand/platform/channel combos..."
          while read -r brand platform channel; do
            [ -z "$brand" ] && continue
            case "$platform" in
              linux)   wf="build-eapp-linux.yml" ;;
              windows) wf="build-eapp-windows.yml" ;;
              macos)   wf="build-eapp-macos.yml" ;;
              android) wf="build-eapp-android.yml" ;;
              # iOS links epnd as a library the ios-lib job publishes after
              # this job; that job dispatches the iOS builds itself.
              ios) continue ;;
              *) echo "skip unknown platform: $platform"; continue ;;
            esac
            echo "→ $wf brand_id=$brand channel=$channel"
            gh workflow run "$wf" -f brand_id="$brand" -f release_channel="$channel"
          done < /tmp/combos.txt

  # THE IN-APP GRAM FOR iPHONE AND iPAD, published beside every other epnd.
  #
  # iOS lets an app start no other program, so epnd goes into the app as a
  # static library (epn-daemon cmd/epnd-ios), and only Apple's toolchain on a
  # Mac can build that. It used to be built inside the iOS app build, from
  # whatever epn-daemon main was at that moment: a second source of truth that
  # skipped vet and checksums. It is built here, from the same commit as the
  # rest of the release, and the iOS app build downloads and verifies it like
  # Android takes its .so. A separate job so a slow macOS queue never holds
  # back Linux, Windows and Android.
  ios-lib:
    needs: [check, vet]
    if: needs.check.outputs.should_build == 'true'
    runs-on: macos-latest
    # A newer run's iOS job replaces this one while it waits in the macOS
    # queue: only the newest library is worth building.
    concurrency:
      group: epnd-ios-lib
      cancel-in-progress: true
    steps:
      - name: Checkout epn-daemon source (private, read-only token)
        uses: actions/checkout@v4
        with:
          repository: 50gramx/epn-daemon
          token: ${{ secrets.CI_READ_TOKEN }}
          ref: ${{ needs.check.outputs.sha }}
          path: epn-daemon

      - uses: actions/setup-go@v5
        with:
          go-version-file: epn-daemon/go.mod
          cache-dependency-path: epn-daemon/go.sum

      - name: Configure git for private Go deps
        run: git config --global url."https://${{ secrets.CI_READ_TOKEN }}@github.com/".insteadOf "https://github.com/"

      - name: Build libepnd-ios-arm64.a
        env:
          GOPRIVATE: 'github.com/50gramx/*,epn.io/*'
        working-directory: epn-daemon
        run: |
          set -euo pipefail
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          CC_IOS=$(xcrun --sdk iphoneos --find clang)
          FLAGS="-isysroot $SDK -arch arm64 -miphoneos-version-min=15.0"
          mkdir -p dist
          CGO_ENABLED=1 GOOS=ios GOARCH=arm64 CC="$CC_IOS" CGO_CFLAGS="$FLAGS" CGO_LDFLAGS="$FLAGS"             go build -trimpath -buildmode=c-archive -ldflags "-s -w -X epn.io/daemon/internal/cmd.Version=${{ needs.check.outputs.sha }}" -o dist/libepnd-ios-arm64.a ./cmd/epnd-ios
          cd dist
          echo "epnd $(git -C .. rev-parse --short HEAD)" > libepnd-ios-arm64.version
          # The .sha256 is uploaded last: an app build that finds it finds the
          # library it names already in place.
          shasum -a 256 libepnd-ios-arm64.a libepnd-ios-arm64.version > libepnd-ios-arm64.sha256
          cat libepnd-ios-arm64.sha256
          ls -la

      - name: Publish to epnd-latest
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: epn-daemon/dist
        run: |
          set -euo pipefail
          # NEVER OVER A NEWER ONE. This job can finish long after its run's
          # publish (the macOS queue), and a newer run may have published by
          # then; or before its own run's publish, when the marker still names
          # the previous build. So: upload unless the release is on a commit
          # that comes AFTER this one in epn-daemon's history.
          ours="${{ needs.check.outputs.sha }}"
          current=$(curl -fsSL "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/epnd-last-built.txt" | cut -d' ' -f1 || true)
          if [ -n "$current" ] && [ "$current" != "$ours" ]; then
            # "ahead": ours has commits current lacks (ours is newer) -> upload.
            st=$(GH_TOKEN="${{ secrets.CI_READ_TOKEN }}" gh api "repos/50gramx/epn-daemon/compare/$current...$ours" --jq .status 2>/dev/null || echo unknown)
            if [ "$st" != ahead ]; then
              echo "::notice::the release is on ${current::8} and this library is ${ours::8} ($st): not uploading over it"
              exit 0
            fi
          fi
          for f in libepnd-ios-arm64.a libepnd-ios-arm64.version libepnd-ios-arm64.sha256; do
            ok=0
            for attempt in 1 2 3 4 5; do
              if gh release upload epnd-latest "$f" --repo "$GITHUB_REPOSITORY" --clobber; then ok=1; break; fi
              echo "::warning file=$f::upload attempt $attempt failed; retrying"
              sleep $((attempt * 20))
            done
            [ "$ok" = 1 ] || { echo "::error::$f not published"; exit 1; }
          done

      - name: Rebuild the iOS apps (manual cascade for critical updates)
        if: github.event_name == 'workflow_dispatch' && inputs.cascade_app_builds == true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run build-eapp-ios.yml --repo "$GITHUB_REPOSITORY"
