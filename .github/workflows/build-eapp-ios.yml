name: Build iOS and iPadOS App (unsigned)

# The Evo app for iPhone and iPad, built in CI so no Mac is needed. This repo is
# public, so its macOS runners cost nothing.
#
# What comes out is an UNSIGNED .ipa. Apple only lets a signed app run, so you
# install it with your own Apple ID through a sideloading tool (Sideloadly or
# AltStore). With a free Apple ID that build runs for 7 days; with the paid
# Developer Program it can be signed for TestFlight. Signing in CI needs the
# certificate and profile as secrets, which this workflow does not hold yet.
#
# It runs when eapp-live has changed since the last iOS build, checked every
# six hours, and on demand.
on:
  workflow_dispatch:
  schedule:
    - cron: '41 */6 * * *'

permissions:
  contents: write

concurrency:
  group: build-eapp-ios
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.compare.outputs.should_build }}
      eapp_sha: ${{ steps.eapp.outputs.sha }}
    steps:
      - name: Latest eapp-live main
        id: eapp
        env:
          GH_TOKEN: ${{ secrets.CI_READ_TOKEN }}
        run: echo "sha=$(gh api repos/50gramx/eapp-live/commits/main --jq .sha)" >> "$GITHUB_OUTPUT"
      - name: Compare against the last iOS build
        id: compare
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EAPP_SHA: ${{ steps.eapp.outputs.sha }}
        run: |
          last=$(gh api repos/50gramx/eapp-releases/contents/data/last-built/evo-ios.json --jq '.content' 2>/dev/null | base64 -d 2>/dev/null | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{console.log(JSON.parse(s).eapp_sha||"")}catch{console.log("")}})')
          if [ "$last" = "$EAPP_SHA" ] && [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            echo "should_build=false" >> "$GITHUB_OUTPUT"; echo "unchanged since $last"
          else
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check
    if: needs.check.outputs.should_build == 'true'
    runs-on: macos-latest
    env:
      # App Store Connect API key (Admin), pasted by the account holder into this
      # repo's secrets. With it the build is signed and sent to TestFlight; without
      # it the unsigned .ipa below is all that comes out.
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      BRAND_ID: evo
    steps:
      - name: Checkout eapp-live (private, read-only token)
        uses: actions/checkout@v4
        with:
          repository: 50gramx/eapp-live
          token: ${{ secrets.CI_READ_TOKEN }}
          ref: ${{ needs.check.outputs.eapp_sha }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.3'
          channel: stable
          cache: true

      - name: Private dependencies
        run: git config --global url."https://${{ secrets.CI_READ_TOKEN }}@github.com/".insteadOf "https://github.com/"

      - name: Dependencies
        run: flutter pub get

      # WHO THE APP IS comes from the brand contract, never from this file: the
      # bundle id App Store Connect knows it by, its team, its name on the home
      # screen. (Flutter's template left com.example.eappLive in the project.)
      - name: Checkout brand contracts
        uses: actions/checkout@v4
        with:
          repository: 50gramx/eapp-interaction-contracts
          token: ${{ secrets.CI_READ_TOKEN }}
          path: .ci/eapp-interaction-contracts

      - name: Resolve the brand
        id: brand
        run: |
          node tool/ci/resolve_contract_delivery.mjs             --contracts-root ".ci/eapp-interaction-contracts"             --brand-id "$BRAND_ID" --platform ios --channel nightly             --github-output "$GITHUB_OUTPUT" --output brand-delivery.json

      - name: Brand the iOS project
        env:
          BUNDLE_ID: ${{ steps.brand.outputs.ios_bundle_id }}
          TEAM_ID: ${{ steps.brand.outputs.ios_team_id }}
          DISPLAY: ${{ steps.brand.outputs.brand_display_name }}
        run: |
          set -euo pipefail
          test -n "$BUNDLE_ID" || { echo "the brand contract names no iOS bundle id"; exit 1; }
          PBX=ios/Runner.xcodeproj/project.pbxproj
          # The app target and its tests; the tests keep their own suffix.
          sed -i '' "s/PRODUCT_BUNDLE_IDENTIFIER = com.example.eappLive;/PRODUCT_BUNDLE_IDENTIFIER = $BUNDLE_ID; DEVELOPMENT_TEAM = $TEAM_ID; CODE_SIGN_STYLE = Automatic;/" "$PBX"
          sed -i '' "s/PRODUCT_BUNDLE_IDENTIFIER = com.example.eappLive.RunnerTests;/PRODUCT_BUNDLE_IDENTIFIER = $BUNDLE_ID.RunnerTests;/" "$PBX"
          grep -c "PRODUCT_BUNDLE_IDENTIFIER = $BUNDLE_ID;" "$PBX"
          P=ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName $DISPLAY" "$P"
          # Only standard HTTPS/TLS: no export-compliance question per build.
          /usr/libexec/PlistBuddy -c "Delete :ITSAppUsesNonExemptEncryption" "$P" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" "$P"
          echo "bundle $BUNDLE_ID, team $TEAM_ID, shown as $DISPLAY"

      # The world asks for the camera, location, motion and microphone. iOS ends
      # any app that asks without saying why, so the reasons go in first.
      - name: Say why the app asks for each sensor
        run: |
          set -euo pipefail
          P=ios/Runner/Info.plist
          put(){ /usr/libexec/PlistBuddy -c "Set :$1 $2" "$P" 2>/dev/null || /usr/libexec/PlistBuddy -c "Add :$1 string $2" "$P"; }
          put NSCameraUsageDescription "Capture photos of a place so the network can build its 3D map."
          put NSLocationWhenInUseUsageDescription "Place you on the map and tag each photo with where it was taken."
          put NSMotionUsageDescription "Use the compass and motion to face the map the way you face."
          put NSMicrophoneUsageDescription "Talk with Evo and people standing in the same region."
          # App Store Connect refuses an upload whose code can reach a protected
          # API without a reason, whether or not the app ever calls it.
          put NSPhotoLibraryUsageDescription "Choose photos to share or to add to a region's map."
          put NSPhotoLibraryAddUsageDescription "Save photos and captures you make in the app."
          put NSLocationAlwaysAndWhenInUseUsageDescription "Place you on the map and tag each photo with where it was taken."
          put NSLocationAlwaysUsageDescription "Place you on the map and tag each photo with where it was taken."
          put NSBluetoothAlwaysUsageDescription "Find nearby devices of yours on the network."
          put NSContactsUsageDescription "Invite people you know to your gramx."
          put NSCalendarsUsageDescription "Add events from your gramx to your calendar."
          put NSSpeechRecognitionUsageDescription "Turn what you say to Evo into text."
          put NSFaceIDUsageDescription "Unlock your keys on this device."
          put NSLocalNetworkUsageDescription "Reach your own grams on the same network."

      # The gram inside the app. iOS will not let an app start another program,
      # so epnd is built as a static library (epn-daemon cmd/epnd-ios) and the
      # epnd_ios plugin links it. If this step fails the app still builds, and
      # says it has no in-app gram.
      - name: Checkout epn-daemon
        uses: actions/checkout@v4
        with:
          repository: 50gramx/epn-daemon
          token: ${{ secrets.CI_READ_TOKEN }}
          path: .epn-daemon

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: .epn-daemon/go.mod
          cache-dependency-path: .epn-daemon/go.sum

      - name: Build the in-app gram (libepnd.a)
        continue-on-error: true
        run: |
          set -euo pipefail
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          CC_IOS=$(xcrun --sdk iphoneos --find clang)
          FLAGS="-isysroot $SDK -arch arm64 -miphoneos-version-min=15.0"
          cd .epn-daemon
          CGO_ENABLED=1 GOOS=ios GOARCH=arm64 CC="$CC_IOS" CGO_CFLAGS="$FLAGS" CGO_LDFLAGS="$FLAGS"             go build -trimpath -buildmode=c-archive -ldflags "-s -w"             -o ../ios/epnd_ios/ios/libepnd.a ./cmd/epnd-ios
          ls -la ../ios/epnd_ios/ios/libepnd.a
          echo "epnd $(git rev-parse --short HEAD)" > ../ios/epnd_ios/ios/EPND_VERSION

      - name: Pods
        run: |
          cd ios
          pod install --repo-update

      - name: Build (no signing)
        run: |
          # Version is the date, the build number the run: both always increase.
          flutter build ios --release --no-codesign --dart-define=BUILD_ID=${{ github.run_number }}             --build-name "$(date -u +%y.%-m.%-d)" --build-number "$((1000 + ${{ github.run_number }}))"

      # SIGNED, TO TESTFLIGHT. Xcode signs with the team's own certificate and
      # profile, created and kept by Apple ("cloud-managed"), authorised by the
      # API key -- no certificate or profile is stored anywhere here.
      - name: Archive, sign and upload to TestFlight
        if: env.ASC_KEY_ID != '' && env.ASC_ISSUER_ID != '' && env.ASC_KEY_P8 != ''
        env:
          TEAM_ID: ${{ steps.brand.outputs.ios_team_id }}
        run: |
          set -euo pipefail
          KEY="$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"
          printf '%s\n' "$ASC_KEY_P8" > "$KEY"
          AUTH=(-allowProvisioningUpdates -authenticationKeyPath "$KEY" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID")
          xcodebuild -workspace ios/Runner.xcworkspace -scheme Runner -configuration Release             -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/Runner.xcarchive" archive "${AUTH[@]}" | tail -40
          cat > "$RUNNER_TEMP/export.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Runner.xcarchive"             -exportOptionsPlist "$RUNNER_TEMP/export.plist" -exportPath "$RUNNER_TEMP/export" "${AUTH[@]}" | tail -40
          rm -f "$KEY"
          echo "uploaded: it shows in TestFlight once Apple has processed it (usually 5-30 min)"

      - name: Package .ipa
        run: |
          set -euo pipefail
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qry evo-ios-unsigned.ipa Payload
          ls -la evo-ios-unsigned.ipa

      - name: Publish
        uses: softprops/action-gh-release@v3
        with:
          files: evo-ios-unsigned.ipa
          tag_name: evo-ios-latest
          name: Evo for iPhone and iPad (unsigned)
          prerelease: true
          body: |
            Unsigned build of eapp-live ${{ needs.check.outputs.eapp_sha }}, run ${{ github.run_number }}.
            Install with Sideloadly or AltStore using your Apple ID. A free Apple ID runs it for 7 days.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout eapp-releases (marker)
        uses: actions/checkout@v4
        with:
          path: .release-meta

      - name: Record this build
        env:
          EAPP_SHA: ${{ needs.check.outputs.eapp_sha }}
        run: |
          set -euo pipefail
          mkdir -p .release-meta/data/last-built
          printf '{\n  "eapp_sha": "%s",\n  "built_at": "%s"\n}\n' "$EAPP_SHA" "$(date -u +%FT%TZ)" > .release-meta/data/last-built/evo-ios.json
          cd .release-meta
          git config user.name "eutopia-ci"
          git config user.email "ci@50gramx.com"
          git add data/last-built/evo-ios.json
          git commit -m "ci: mark evo/ios built" || exit 0
          for i in $(seq 1 6); do
            git pull --rebase --autostash -q origin main || git rebase --abort || true
            if git push -q origin HEAD:main; then exit 0; fi
            sleep $((RANDOM % 4 + 2))
          done
