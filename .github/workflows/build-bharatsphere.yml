name: Deploy bharatsphere

# Runs bharatsphere-app's deployment from THIS repo because this repo is public
# and therefore has free Actions minutes; the private repo's minutes are the
# scarce resource. The private repo is untouched — we poll its latest `main` SHA
# and latest `v*` tag (via CI_READ_TOKEN, read-only) and only deploy when either
# moves. Markers live on this repo's main:
#
#   bharatsphere-last-live.txt       last main SHA deployed to live
#   bharatsphere-last-deployed.txt   last main SHA deployed to demo (manual only)
#
# WHAT IS AND IS NOT HERE. Live on every new main commit, automatically; demo
# only when chosen by hand (2026-11-05). The Android/Play path did NOT — it is
# manual, rare, and signing a public-repo build with the keystore would mean
# putting bharatsphere's upload key and Play credentials into a repo that already
# holds different values under those same secret names. It stays in
# bharatsphere-app/.github/workflows/deploy.yml (now workflow_dispatch-only).
#
# NOTHING PRIVATE MAY LEAVE THIS RUNNER. The private checkout lands in
# ./bharatsphere and is deployed straight to Firebase. No upload-artifact, no
# release, no step summary of source — artifacts and logs on a public repo are
# world-readable.
#
# CREDENTIALS ARE SERVICE ACCOUNTS, NOT CI TOKENS. `firebase login:ci` mints a
# token bound to a PERSON's Google account, and `--token` is deprecated besides.
# A project-scoped robot is the right shape anywhere, and more so here: this
# workflow lives in a public repo, so the credential it carries should be one
# that can be rotated and audited per project rather than one that inherits a
# founder's whole Google identity. The JSON is written to a file and passed via
# GOOGLE_APPLICATION_CREDENTIALS, which firebase-tools, gcloud and firebase-admin
# all read without being told.
#
# Firestore indexes ride along unchanged: `validate-indexes.js` gates the deploy
# and `firestore:indexes` is in the same --only list it always was, so index
# changes still ship with the code that needs them. bharatsphere-app's own
# deploy_indexes.yml stays where it is as the manual escape hatch.
on:
  schedule:
    # Offset off :00/:15/:30/:45 — the most congested minutes in GitHub's shared
    # scheduled-workflow queue, where runs are frequently delayed or dropped.
    # Same reasoning (and a different offset) as build-epnd.yml.
    - cron: '9,24,39,54 * * * *'
  # GitHub drops most scheduled runs on this repo (2026-11-05: the cron above
  # fired about every 4-7 hours, not every 15 minutes). bootstrap-01's status
  # pushes drive Aggregate founder nodes every ~15 minutes, and pages.yml and
  # deploy-site-nextjs.yml already ride that clock; so does this poll. The
  # check job is seconds long and deploys only when main moved.
  workflow_run:
    workflows: ['Aggregate founder nodes']
    types: [completed]
  workflow_dispatch:
    inputs:
      deploy_target:
        description: 'Deploy now, ignoring the marker'
        required: true
        default: live
        type: choice
        options:
          - live
          - demo

permissions:
  contents: write

# A deploy writes to Firebase Hosting, Firestore rules/indexes and Functions.
# Two overlapping runs would race each other onto the same project, so the
# poller must never lap itself.
concurrency:
  group: deploy-bharatsphere
  cancel-in-progress: false

jobs:
  check:
    # A cancelled or failed aggregate is no clock tick worth a poll.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.latest.outputs.sha }}
      tag: ${{ steps.latest.outputs.tag }}
      deploy_demo: ${{ steps.compare.outputs.deploy_demo }}
      deploy_live: ${{ steps.compare.outputs.deploy_live }}
      live_ref: ${{ steps.compare.outputs.live_ref }}
    steps:
      - uses: actions/checkout@v4

      - name: Get latest bharatsphere-app main SHA and v* tag
        id: latest
        env:
          GH_TOKEN: ${{ secrets.CI_READ_TOKEN }}
        run: |
          set -euo pipefail
          sha=$(gh api repos/50gramx/bharatsphere-app/commits/main --jq .sha)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          # The tags endpoint does not order by version, so sort -V ourselves and
          # take the highest. Empty is fine — it just means live never fires.
          tag=$(gh api repos/50gramx/bharatsphere-app/tags --paginate --jq '.[].name' \
                | grep '^v' | sort -V | tail -1 || true)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "main=$sha tag=${tag:-<none>}"

      - name: Compare against markers
        id: compare
        env:
          DISPATCH: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy_target || '' }}
          SHA: ${{ steps.latest.outputs.sha }}
          TAG: ${{ steps.latest.outputs.tag }}
        run: |
          set -euo pipefail
          demo=false; live=false; adopt=false; live_ref=""
          # LIVE IS THE DEFAULT (founder, 2026-11-05). Every new commit on
          # bharatsphere-app main deploys to production on the next poll; demo
          # is only ever a deliberate manual choice. Waiting for a v* tag meant
          # production silently fell weeks behind main while demo deploys kept
          # failing, and grams called backend functions that were never live.
          # The live marker records the main SHA that last reached production.
          case "$DISPATCH" in
            demo) demo=true ;;
            live) live=true; live_ref="$SHA" ;;
            *)
              [ "$(cat bharatsphere-last-live.txt 2>/dev/null || echo)" = "$SHA" ] || { live=true; live_ref="$SHA"; }
              ;;
          esac
          echo "deploy_demo=$demo" >> "$GITHUB_OUTPUT"
          echo "deploy_live=$live" >> "$GITHUB_OUTPUT"
          echo "adopt=$adopt" >> "$GITHUB_OUTPUT"
          echo "live_ref=$live_ref" >> "$GITHUB_OUTPUT"
          echo "demo=$demo live=$live adopt=$adopt live_ref=${live_ref:-<none>}"

      - name: Adopt the current tag as the live baseline
        if: steps.compare.outputs.adopt == 'true'
        run: |
          .github/scripts/push-marker.sh \
            bharatsphere-last-released.txt "${{ steps.latest.outputs.tag }}" \
            "ci: adopt ${{ steps.latest.outputs.tag }} as bharatsphere live baseline"

  # ========================================================================
  # DEMO WEB (was: push to bharatsphere-app main)
  # ========================================================================
  deploy_demo:
    needs: check
    if: needs.check.outputs.deploy_demo == 'true'
    runs-on: ubuntu-latest
    env:
      GOOGLE_APPLICATION_CREDENTIALS: /tmp/bharatsphere-sa.json
    steps:
      - uses: actions/checkout@v4

      - name: Checkout bharatsphere-app (private, read-only token)
        uses: actions/checkout@v4
        with:
          repository: 50gramx/bharatsphere-app
          token: ${{ secrets.CI_READ_TOKEN }}
          ref: ${{ needs.check.outputs.sha }}
          path: bharatsphere

      - name: Generate version number
        id: version
        # Same YEAR.MMDD.build shape as before. The build counter is now this
        # repo's run_number rather than bharatsphere-app's, so the number jumps
        # once at the cutover — it stays monotonic from here, and nothing reads
        # it as a Play versionCode (Android did not move).
        run: echo "VERSION=$(date +'%Y.%m%d').${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Update pubspec.yaml version
        working-directory: bharatsphere/bharatsphere_mobile
        run: |
          sed -i "s/^version: .*/version: ${{ steps.version.outputs.VERSION }}/" pubspec.yaml

      - uses: subosito/flutter-action@v2
        with:
          # NOT pinned to a patch version. The pin inherited from the private
          # repo's workflow was 3.41.5 while the app had already moved on (see
          # "migrate feather -> lucide to unblock Flutter 3.44 builds"), and
          # pubspec.lock now wants flutter >=3.35.0 with dart >=3.10.0-0. A
          # version written in THIS repo cannot track upgrades made in THAT one,
          # so it only ever drifts. Track stable; pin here deliberately if a
          # stable release ever breaks the build.
          channel: 'stable'
          cache: true

      - name: Build web (dev)
        working-directory: bharatsphere/bharatsphere_mobile
        run: |
          flutter pub get
          flutter build web --release --dart-define=ENVIRONMENT=dev \
            --build-name=${{ steps.version.outputs.VERSION }} \
            --build-number=${{ github.run_number }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Install dependencies
        working-directory: bharatsphere
        run: |
          (cd functions && npm ci)
          (cd scripts && npm install)

      - name: Write service account credentials
        env:
          SA: ${{ secrets.BHARATSPHERE_FIREBASE_SERVICE_ACCOUNT_DEV }}
        run: |
          if [ -z "${SA:-}" ]; then
            echo "::error::BHARATSPHERE_FIREBASE_SERVICE_ACCOUNT_DEV is not set — cannot deploy."
            exit 1
          fi
          # printf from the environment, never inline: an interpolated secret is
          # masked in logs but is still the literal text of the command GitHub
          # renders, so keep it out of the command line entirely.
          printf '%s' "$SA" > "$GOOGLE_APPLICATION_CREDENTIALS"
          chmod 600 "$GOOGLE_APPLICATION_CREDENTIALS"

      - name: Validate Firestore indexes
        working-directory: bharatsphere
        run: node scripts/validate-indexes.js --project bharatsphere-app-dev

      - name: Deploy to Firebase (demo)
        working-directory: bharatsphere
        # No `firebase use`: it writes a login-scoped alias and expects an
        # interactive account. --project takes the ID directly, and .firebaserc
        # keys its hosting targets by that same ID, so targets still resolve.
        run: |
          cp remote_config/remote_config_dev.json remote_config/remote_config_template.json
          firebase deploy \
            --only hosting:app,firestore:rules,firestore:indexes,storage,functions,remoteconfig,database \
            --project bharatsphere-app-dev --force

      - name: Update Firestore version record
        continue-on-error: true
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.BHARATSPHERE_FIREBASE_SERVICE_ACCOUNT_DEV }}
          VERSION: ${{ steps.version.outputs.VERSION }}
        working-directory: bharatsphere/functions
        run: |
          npm install firebase-admin --silent
          node -e "
            const admin = require('firebase-admin');
            admin.initializeApp({ credential: admin.credential.cert(JSON.parse(process.env.FIREBASE_SERVICE_ACCOUNT)) });
            admin.firestore().collection('config').doc('app').set({
              webVersion: process.env.VERSION,
              lastUpdated: admin.firestore.FieldValue.serverTimestamp(),
              updatedBy: 'eapp-releases-demo',
            }, { merge: true }).then(() => console.log('version updated'));
          "

      - name: Update marker
        run: |
          "${GITHUB_WORKSPACE}/.github/scripts/push-marker.sh" \
            bharatsphere-last-deployed.txt "${{ needs.check.outputs.sha }}" \
            "ci: deployed bharatsphere demo @ ${{ needs.check.outputs.sha }}"

  # ========================================================================
  # LIVE (was: v* tag push on bharatsphere-app)
  # ========================================================================
  deploy_live:
    needs: check
    if: needs.check.outputs.deploy_live == 'true'
    runs-on: ubuntu-latest
    environment: bharatsphere-live
    env:
      GOOGLE_APPLICATION_CREDENTIALS: /tmp/bharatsphere-sa.json
    steps:
      - uses: actions/checkout@v4

      - name: Checkout bharatsphere-app at the release ref
        uses: actions/checkout@v4
        with:
          repository: 50gramx/bharatsphere-app
          token: ${{ secrets.CI_READ_TOKEN }}
          ref: ${{ needs.check.outputs.live_ref }}
          path: bharatsphere

      - name: Generate version number
        id: version
        run: echo "VERSION=$(date +'%Y.%V').${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Update pubspec.yaml version
        working-directory: bharatsphere/bharatsphere_mobile
        run: |
          sed -i "s/^version: .*/version: ${{ steps.version.outputs.VERSION }}/" pubspec.yaml

      - uses: subosito/flutter-action@v2
        with:
          # NOT pinned to a patch version. The pin inherited from the private
          # repo's workflow was 3.41.5 while the app had already moved on (see
          # "migrate feather -> lucide to unblock Flutter 3.44 builds"), and
          # pubspec.lock now wants flutter >=3.35.0 with dart >=3.10.0-0. A
          # version written in THIS repo cannot track upgrades made in THAT one,
          # so it only ever drifts. Track stable; pin here deliberately if a
          # stable release ever breaks the build.
          channel: 'stable'
          cache: true

      - name: Build web (prod)
        working-directory: bharatsphere/bharatsphere_mobile
        run: |
          flutter pub get
          flutter build web --release --dart-define=ENVIRONMENT=prod \
            --build-name=${{ steps.version.outputs.VERSION }} \
            --build-number=${{ github.run_number }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # hosting:demo is HunarManch (bharat-spheres-vibes is hunarmanch-web).
      - name: Build HunarManch landing page
        working-directory: bharatsphere/bharat-spheres-vibes
        run: |
          npm ci
          npm run build

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Install dependencies
        working-directory: bharatsphere
        run: |
          (cd functions && npm ci)
          (cd scripts && npm install)

      - name: Write service account credentials
        env:
          SA: ${{ secrets.BHARATSPHERE_FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "${SA:-}" ]; then
            echo "::error::BHARATSPHERE_FIREBASE_SERVICE_ACCOUNT is not set — cannot deploy."
            exit 1
          fi
          printf '%s' "$SA" > "$GOOGLE_APPLICATION_CREDENTIALS"
          chmod 600 "$GOOGLE_APPLICATION_CREDENTIALS"

      - name: Validate Firestore indexes
        working-directory: bharatsphere
        run: node scripts/validate-indexes.js --project bharatsphere-183e7

      - name: Seed pincodes
        env:
          SERVICE_ACCOUNT_JSON: ${{ secrets.BHARATSPHERE_FIREBASE_SERVICE_ACCOUNT }}
        working-directory: bharatsphere
        run: |
          npm install firebase-admin csv-parser
          node scripts/ingest_pincodes.js bharatsphere_mobile/assets/5c2f62fe-5afa-4119-a499-fec9d604d5bd.csv

      # HOSTING IS NO LONGER DEPLOYED FROM HERE (founder, 2026-09-20).
      #
      # `hosting:app` is the site bharatsphere-app, which carries
      # live.50gramx.com. That origin now serves the eapp-live web bundle
      # (build-eapp-web.yml, brand evo) with bharatsphere integrated inside
      # it, so deploying hosting:app from here would overwrite the live
      # experience on every bharatsphere release. `hosting:demo` is the
      # HunarManch landing page, and that domain is being let go.
      #
      # Everything else this workflow owns -- rules, indexes, storage,
      # functions, remote config, database -- still ships, because the
      # identity and data project is still bharatsphere-183e7.
      #
      # The two web build steps above are left in place so a hosting deploy
      # can be restored by putting the targets back; drop them once live is
      # confirmed on the eapp-live bundle.
      - name: Deploy to Firebase (live)
        working-directory: bharatsphere
        run: |
          cp remote_config/remote_config_prod.json remote_config/remote_config_template.json
          firebase deploy \
            --only firestore:rules,firestore:indexes,storage,functions,remoteconfig,database \
            --project bharatsphere-183e7 --force

      - name: Update Firestore version record
        continue-on-error: true
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.BHARATSPHERE_FIREBASE_SERVICE_ACCOUNT }}
          VERSION: ${{ steps.version.outputs.VERSION }}
        working-directory: bharatsphere/functions
        run: |
          npm install firebase-admin --silent
          node -e "
            const admin = require('firebase-admin');
            admin.initializeApp({ credential: admin.credential.cert(JSON.parse(process.env.FIREBASE_SERVICE_ACCOUNT)) });
            admin.firestore().collection('config').doc('app').set({
              webVersion: process.env.VERSION,
              lastUpdated: admin.firestore.FieldValue.serverTimestamp(),
              updatedBy: 'eapp-releases-prod',
            }, { merge: true }).then(() => console.log('version updated'));
          "

      - name: Update marker
        # Every live deploy of main advances the live marker, manual or polled.
        run: |
          "${GITHUB_WORKSPACE}/.github/scripts/push-marker.sh" \
            bharatsphere-last-live.txt "${{ needs.check.outputs.live_ref }}" \
            "ci: deployed bharatsphere live @ ${{ needs.check.outputs.live_ref }}"
