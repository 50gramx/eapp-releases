name: Build 50gramx.com

# The brand site is a static export: every number on /, /regions and /region/<pincode>
# is fetched at BUILD time and baked into HTML. So a deploy is not only how code
# ships — it is the only way the network's state reaches a reader.
#
# This workflow runs from eapp-releases, which is the source of network truth:
#   - When aggregate-founders publishes new signed data (communities.json, models.json),
#     we rebuild the site to reflect those new regions and model measurements.
#   - When eapp-nextjs code changes, a manual trigger here rebuilds the site.
#   - Nightly schedule as backstop, in case a dispatch is lost.
#
# The site's own firebase-hosting-merge.yml is now manual-only (no auto triggers),
# to consolidate CI in the data source (eapp-releases) instead of the consumer.
#
# Sitemap generation: Automatic during build via src/app/sitemap.ts
#   - Fetches active regions from mesh API for dynamic /region/[pincode] URLs
#   - Fetches models from inference API for dynamic /inference/models/[slug] URLs
#   - Includes all static pages, excludes /demo/* dynamic routes
on:
  workflow_run:
    workflows: ['Aggregate founder nodes']
    types: [completed]
  workflow_dispatch:
  schedule:
    - cron: '17 1 * * *'

permissions:
  # write: the built site is published as a release asset (site-latest), which
  # the company gramx's site follows. No secret of the network's is used.
  contents: write
  actions: read

# ONE DEPLOY AT A TIME, AND ONLY OF DATA THAT WAS PUBLISHED.
#
# bootstrap-01 reports in four commits within seconds (snapshot, mesh, fleet,
# heartbeat), each one an aggregate-founders run, and every one of those runs
# -- including the ones GitHub cancelled as superseded -- fired a deploy here.
# Four site builds ran side by side on 2026-10-20 09:07 UTC, each racing the
# others to Firebase. A newer deploy now cancels an older one (the newest data
# is the only one worth shipping), and a cancelled or failed aggregate deploys
# nothing because it published nothing.
concurrency:
  group: deploy-site
  cancel-in-progress: true

jobs:
  build_and_deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      # Next's anonymous usage telemetry is on by default; a build of this site
      # reports nothing to anyone.
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - name: Checkout eapp-nextjs repo
        uses: actions/checkout@v4
        with:
          repository: 50gramx/eapp-nextjs-implementation-firebase
          token: ${{ secrets.SITE_DISPATCH_TOKEN }}

      # The site says which Node and npm build it: .nvmrc and packageManager.
      # Node 20 was below what libp2p's p-retry needs (EBADENGINE), and an npm
      # older than the one that wrote the lockfile refuses `npm ci`.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: 'npm'

      - name: Setup npm
        run: npm install -g "$(node -p 'require("./package.json").packageManager')"

      # The compiler's cache only. .next/cache/fetch-cache is left out on
      # purpose: a fetch cached by an earlier build would render that build's
      # network state into this one.
      - name: Restore Next.js compiler cache
        uses: actions/cache@v4
        with:
          path: .next/cache/webpack
          key: next-webpack-${{ hashFiles('package-lock.json') }}-${{ github.run_id }}
          restore-keys: next-webpack-${{ hashFiles('package-lock.json') }}-

      # ── THE VIEWER, DOWNLOADED FROM THE BUILD THAT PRODUCED IT ──────
      #
      # /world loads the same page a gram serves at /v1/world, plus the shell
      # that lets a browser dial a gram and verify what it gets back. It is Go
      # code compiled to wasm, and it is built by build-epnd.yml alongside the
      # daemon binaries — behind the same `go vet` gate, and only when
      # epn-daemon actually moves.
      #
      # This step used to check out epn-daemon and compile it here, which meant
      # a Go toolchain, a module download and an npm install on EVERY site
      # deploy — four times an hour, chasing aggregate-founders — to rebuild an
      # asset that had not changed. It also meant the site could not deploy at
      # all while epn-daemon was unreachable: a copy edit to a marketing page
      # was blocked by a token that has nothing to do with the site.
      #
      # Still copied, never forked: one definition, one build, downloaded here.
      - name: Fetch the world viewer (published by build-epnd)
        run: |
          set -euo pipefail
          base=https://github.com/50gramx/eapp-releases/releases/download/epnd-latest
          dest="$GITHUB_WORKSPACE/public/world/viewer"
          mkdir -p "$dest"
          tmp=$(mktemp -d)
          for f in epn.wasm wasm_exec.js epn-shell.js world-viewer.html checksums.txt; do
            curl -fsSL --retry 3 --retry-delay 5 -o "$tmp/$f" "$base/$f"
          done
          # VERIFY BEFORE SERVING. These arrive over the network now rather than
          # out of a compiler, so the published checksums are the only thing
          # standing between a truncated download and a broken viewer shipped
          # to every reader. grep the four lines we care about; checksums.txt
          # also covers the binaries, which are not here.
          ( cd "$tmp"
            grep -E ' (epn\.wasm|wasm_exec\.js|epn-shell\.js|world-viewer\.html)$' checksums.txt > viewer.sums
            if [ "$(wc -l < viewer.sums)" -ne 4 ]; then
              echo "::error::checksums.txt is missing viewer entries — has build-epnd published since this change?"
              exit 1
            fi
            sha256sum -c viewer.sums )
          # index.html, because that is what a static host serves at the root,
          # and public/ is what `output: export` copies verbatim into out/ — so
          # the viewer lands at /world/viewer/ with no route to declare.
          cp "$tmp/world-viewer.html" "$dest/index.html"
          cp "$tmp/epn.wasm" "$tmp/wasm_exec.js" "$tmp/epn-shell.js" "$dest/"
          # -- AND SOMEWHERE FOR IT TO KNOCK ----------------------------
          #
          # The viewer finds a gram three ways, in order of who knows best:
          # an explicit ?addr=, the ?peers= of the grams holding the region,
          # and this file for "any gram, when nobody said which". The third
          # was described in the code and never published, so opening a
          # region whose holders list is empty -- four of the five the network
          # has reached -- ended at a 404 that reads like the network is down.
          #
          # Built by the aggregator from mesh.json, which already knew every
          # address every reporter had seen, filtered to what a browser on an
          # https page can actually dial. Unsigned and safe: a peer id is
          # inside every multiaddr and the handshake proves it, so a wrong
          # address costs a failed dial and never becomes a wrong peer.
          #
          # NOT fatal when absent. A site deploy that runs before the
          # aggregator has ever written this file is the ordinary first state,
          # and it leaves the viewer exactly where it already was.
          curl -fsSL --retry 3 --retry-delay 5 -o "$dest/peers.json" https://50gramx.github.io/eapp-releases/data/peers.json || echo "::warning::no peers.json published yet - the viewer has no fallback entry point"
          rm -rf "$tmp"
          ls -la "$dest"

      - name: Install dependencies
        run: npm ci

      - name: Build static export (includes sitemap with real data)
        env:
          NEXT_PUBLIC_SITE_URL: https://50gramx.com
        run: |
          # The site's commit is its build ID (next.config.mjs), and the change
          # report below names it.
          echo "SITE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          npm run build

      # 50gramx.com is the company gramx's site (gramx DG1h70GzVONqlxjluvnM,
      # site "www"). It FOLLOWS ITS SOURCE: this job publishes the built site as
      # site.tar.gz and its SHA-256 on the rolling release "site-latest", and
      # any member gram of the gramx publishes each new build to the network's
      # edges with its own membership. This job holds no secret of the network.
      - name: Publish the build for the company gramx to follow
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # WHAT THIS BUILD CHANGED, against the build the gramx serves now
          # (15 Nov 2026). Every build used to publish ~8,000 files that the
          # member grams then fetched, hashed and announced, though almost all
          # were byte-identical apart from a random build ID. The comparison is
          # published beside the archive (site-changes.json) and in this job's
          # summary, so how much each build really changes is always visible.
          prev="$RUNNER_TEMP/prev"; mkdir -p "$prev" "$RUNNER_TEMP/prevdl"
          # Through the API, not the download link: that link is cached and
          # once served an older build, and a delta must start from exactly
          # the archive the member grams have.
          prev_sha=""
          if gh release download site-latest --repo "$REPO" -p site.tar.gz -p site.tar.gz.sha256 -D "$RUNNER_TEMP/prevdl" 2>/dev/null; then
            tar -xzf "$RUNNER_TEMP/prevdl/site.tar.gz" -C "$prev"
            prev_sha=$( cd "$RUNNER_TEMP/prevdl" && sha256sum site.tar.gz | cut -d' ' -f1 )
          fi
          sums() { ( cd "$1" 2>/dev/null && find . -type f -print0 | sort -z | xargs -0 -r sha256sum ) || true; }
          sums out > "$RUNNER_TEMP/new.sums"
          sums "$prev/out" > "$RUNNER_TEMP/prev.sums"
          node - "$RUNNER_TEMP/prev.sums" "$RUNNER_TEMP/new.sums" "$RUNNER_TEMP/site-changes.json" <<'JS'
          const fs = require('fs');
          const [prevPath, nextPath, outPath] = process.argv.slice(2);
          const read = (p) => new Map(fs.readFileSync(p, 'utf8').split('\n').filter(Boolean).map((l) => [l.slice(66), l.slice(0, 64)]));
          const a = read(prevPath), b = read(nextPath);
          const changed = [], added = [], removed = [];
          for (const [f, h] of b) { if (!a.has(f)) added.push(f); else if (a.get(f) !== h) changed.push(f); }
          for (const f of a.keys()) if (!b.has(f)) removed.push(f);
          const size = (f) => { try { return fs.statSync('out/' + f.replace(/^\.\//, '')).size; } catch { return 0; } };
          const bytes = [...changed, ...added].reduce((n, f) => n + size(f), 0);
          const section = (f) => f.replace(/^\.\//, '').split('/')[0];
          const bySection = {};
          for (const f of [...changed, ...added]) bySection[section(f)] = (bySection[section(f)] || 0) + 1;
          const report = {
            built_at: new Date().toISOString(),
            site_commit: process.env.SITE_COMMIT || null,
            files: b.size, changed: changed.length, added: added.length, removed: removed.length,
            changed_mb: Math.round(bytes / 1e5) / 10,
            by_section: Object.fromEntries(Object.entries(bySection).sort((x, y) => y[1] - x[1])),
            sample: [...changed, ...added].slice(0, 40),
            first_build: a.size === 0,
          };
          fs.writeFileSync(outPath, JSON.stringify(report, null, 2) + '\n');
          // What a member gram needs to take this build as its changes.
          fs.writeFileSync(outPath + '.list', [...changed, ...added].sort().map((f) => 'out/' + f.replace(/^\.\//, '')).join('\n') + ([...changed, ...added].length ? '\n' : ''));
          fs.writeFileSync(outPath + '.removed', JSON.stringify(removed.sort()));
          console.log(JSON.stringify(report));
          JS
          changes=$(node -p "const r=require('$RUNNER_TEMP/site-changes.json'); r.changed + r.added + r.removed")
          {
            echo "### What this build changed"
            node -p "const r=require('$RUNNER_TEMP/site-changes.json'); \`\${r.changed} changed, \${r.added} added, \${r.removed} removed of \${r.files} files (\${r.changed_mb} MB)\`"
            echo; echo '```'; node -p "JSON.stringify(require('$RUNNER_TEMP/site-changes.json').by_section, null, 1)"; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -s "$RUNNER_TEMP/prev.sums" ] && [ "$changes" = "0" ]; then
            echo "The build is identical to the one the gramx serves: nothing to publish."
            exit 0
          fi
          # A REPRODUCIBLE ARCHIVE: names sorted, times and owners fixed, gzip
          # without its own timestamp. The same files make the same bytes, so the
          # member grams' checksum check is what decides there is nothing new.
          tar --sort=name --mtime='@0' --owner=0 --group=0 --numeric-owner -cf - out | gzip -n -9 > "$RUNNER_TEMP/site.tar.gz"
          ( cd "$RUNNER_TEMP" && sha256sum site.tar.gz > site.tar.gz.sha256 )
          # THE CHANGES, AS THEIR OWN ARCHIVE (15 Nov 2026). A member gram that
          # has the previous build (prev_sha) fetches only these, not the whole
          # site; one that does not takes the whole archive as before.
          extra=()
          if [ -n "$prev_sha" ]; then
            tar --sort=name --mtime='@0' --owner=0 --group=0 --numeric-owner -cf - -T "$RUNNER_TEMP/site-changes.json.list" | gzip -n -9 > "$RUNNER_TEMP/site.tar.gz.delta.tar.gz"
            node -e '
              const fs = require("fs"); const t = process.env.RUNNER_TEMP;
              const sha = (f) => require("crypto").createHash("sha256").update(fs.readFileSync(f)).digest("hex");
              fs.writeFileSync(t + "/site.tar.gz.delta.json", JSON.stringify({
                base: process.argv[1], sha: sha(t + "/site.tar.gz"),
                delta_sha256: sha(t + "/site.tar.gz.delta.tar.gz"),
                removed: JSON.parse(fs.readFileSync(t + "/site-changes.json.removed", "utf8")),
              }) + "\n");' "$prev_sha"
            extra=("$RUNNER_TEMP/site.tar.gz.delta.tar.gz" "$RUNNER_TEMP/site.tar.gz.delta.json")
            echo "changes archive: $(du -h "$RUNNER_TEMP/site.tar.gz.delta.tar.gz" | cut -f1)" >> "$GITHUB_STEP_SUMMARY"
          fi
          if ! gh release view site-latest --repo "$REPO" >/dev/null 2>&1; then
            gh release create site-latest --repo "$REPO" --title "50gramx.com — latest build (rolling)" \
              --notes "The built 50gramx.com, followed by the company gramx's site. Replaced on every build." --latest=false
          fi
          # The checksum LAST: a member gram looks at it first, and only once it
          # moves does it read the changes and the archive, which are up by then.
          gh release upload site-latest --repo "$REPO" --clobber "$RUNNER_TEMP/site.tar.gz" "$RUNNER_TEMP/site-changes.json" "${extra[@]}"
          gh release upload site-latest --repo "$REPO" --clobber "$RUNNER_TEMP/site.tar.gz.sha256"

      # NO FIREBASE DEPLOY (founder, 15 Nov 2026). 50gramx.com is served by the
      # company gramx from the archive above; Firebase Hosting is no longer a
      # host of this site, and its billing is past due.
