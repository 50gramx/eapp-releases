name: Aggregate founder nodes

# Builds data/founders.json from data/nodes/*.json. founders.json is a fully
# derived artifact, so the commit step syncs to origin and REGENERATES before
# each push attempt — this makes concurrent runs conflict-free (no rebase of a
# stale generated file, which was the old failure mode).
on:
  schedule:
    - cron: '9,24,39,54 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['data/nodes/**']

permissions:
  contents: write

# ONE RUN PER REPORT, NOT ONE PER COMMIT. bootstrap-01 reports as four commits
# a few seconds apart (snapshot, mesh, fleet, heartbeat). Each used to start a
# run, two of them finished, and both committed: two aggregates, two Pages
# deploys and two site builds every 15 minutes, the first built from a report
# that was only half pushed. A newer push now cancels the run before it, and
# each run waits for the burst to settle before it reads anything, so the
# last commit of a report produces the one aggregate.
concurrency:
  group: aggregate-founders
  cancel-in-progress: true

jobs:
  aggregate:
    runs-on: ubuntu-latest
    steps:
      - name: Let the report's burst of commits settle
        if: github.event_name == 'push'
        run: sleep 25
      - uses: actions/checkout@v4
      - name: Regenerate + push (retry, conflict-free)
        # SITE_DISPATCH_TOKEN is a PAT with `contents: write` on the brand-site
        # repo. GITHUB_TOKEN cannot reach another repository. When it is unset the
        # dispatch is skipped and says so — the site's nightly cron still catches
        # up, so a missing secret degrades freshness rather than breaking the run.
        env:
          SITE_DISPATCH_TOKEN: ${{ secrets.SITE_DISPATCH_TOKEN }}
        run: |
          git config user.name "eutopia-ci"
          git config user.email "ci@50gramx.com"
          for i in $(seq 1 6); do
            git fetch -q origin main
            git reset -q --hard origin/main
            # Name any new pincode from the pincode itself (tools/region-labels.mjs):
            # cached in data/pincode-directory.json, one lookup a second, never fatal.
            node tools/region-labels.mjs resolve || true
            # Cited market facts (OpenRouter prices, hub licences) for the value
            # table: refreshed on their own clocks, never fatal (tools/market.mjs).
            node tools/market.mjs refresh || true
            node tools/aggregate-founders.mjs
            # Stage first, then ask whether anything changed. data/communities.json
            # did not exist in the tree, and `git diff` on an untracked path reports
            # no difference — so the old guard exited "no change" and the file the
            # aggregator had just written was thrown away on every run, for as long
            # as buildCommunities() has existed. --cached sees adds as well as edits.
            # THE LIST IS THE BUG SURFACE. Every output the aggregator writes has to
            # be named here or it is silently discarded on every run — which is
            # exactly what happened to data/communities.json once (see above) and
            # then, identically, to data/gramx.json: written by main(), never staged,
            # thrown away by the reset --hard at the top of the next run. A file that
            # is generated and never committed looks like an aggregator bug and is a
            # workflow one.
            git add -A data/
            if git diff --cached --quiet; then
              echo "no change"; exit 0
            fi
            # A run that only restamps its own clock (generated_at,
            # published_at) changed nothing anyone reads: commit nothing, so
            # nothing downstream deploys.
            if [ -z "$(git diff --cached -U0 | grep -E '^[+-] ' | grep -vE '^[+-] *"(generated_at|published_at)": ')" ]; then
              echo "only timestamps moved; nothing to publish"; git reset -q --hard origin/main; exit 0
            fi
            git commit -q -m "ci: aggregate founder nodes + network/bests/communities/gramx proof"
            if git push -q origin HEAD:main; then
              echo "pushed"
              # The brand site is a static export: its region pages are baked at
              # build time, and a new mohalla is a new ROUTE that only a build can
              # create. Publishing the aggregate is therefore only half the job —
              # tell the site to rebuild. Best-effort: a lost dispatch costs a few
              # hours of staleness, and the site's nightly cron catches it.
              if [ -n "${SITE_DISPATCH_TOKEN:-}" ]; then
                code=$(curl -sS -o /dev/null -w '%{http_code}' -X POST \
                  -H 'Accept: application/vnd.github+json' \
                  -H "Authorization: Bearer $SITE_DISPATCH_TOKEN" \
                  https://api.github.com/repos/50gramx/eapp-nextjs-implementation-firebase/dispatches \
                  -d '{"event_type":"aggregate-published"}' || echo 000)
                echo "site rebuild dispatch -> $code"
              else
                echo "SITE_DISPATCH_TOKEN unset — site will refresh on its nightly cron"
              fi
              exit 0
            fi
            echo "push raced (attempt $i) — re-syncing"; sleep $((RANDOM % 4 + 2))
          done
          echo "gave up after retries — next run will catch up (not a failure)"; exit 0
